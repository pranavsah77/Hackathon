<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qartix — Campus EV Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background-color: #13161B;
      color: #F4F5F7;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-text-fill-color: #F4F5F7 !important;
      -webkit-box-shadow: 0 0 0px 1000px #13161B inset !important;
      transition: background-color 5000s ease-in-out 0s !important;
    }
  </style>
  <!-- React & Three.js via CDN for Instant Standalone Verification -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Supabase Public Configuration & Client
    const SUPABASE_URL = 'https://arbwqtudubtyxufbjojq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyYndxdHVkdWJ0eXh1ZmJqb2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MTk3MjcsImV4cCI6MjEwODQ5NTcyN30.cOkLai5YpcN2d_FOidjkwGKoAweXn3YAVoFA2ERW5QA';
    const supabase = (typeof window !== 'undefined' && window.supabase)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true }
        })
      : null;

    function normalizeStudentEmail(identifier) {
      const clean = (identifier || '').trim().toLowerCase();
      if (clean.includes('@')) return clean;
      return `${clean.replace(/[^a-z0-9_-]/g, '')}@qartix.campus`;
    }

    function normalizeDriverEmail(driverId) {
      const clean = (driverId || '').trim().toLowerCase();
      if (clean.includes('@')) return clean;
      return `${clean.replace(/[^a-z0-9_-]/g, '')}@driver.qartix.campus`;
    }

    function normalizeDriverPin(pin) {
      const p = (pin || '').trim();
      if (p === '4021') return 'driverPin4021';
      if (p.length < 6) return `${p}_qartix_driver`;
      return p;
    }

    // =========================================================
    // 1. AUTHPAGE COMPONENT
    // =========================================================

/**
 * StudentDashboard Component (Redesigned Ultra-Clean 2-Tab Layout)
 */
function StudentDashboard({
  student = { id: 'STU-84920', fullName: 'Pranav Kumar', hostelBlock: 'Block-C Oak Hall' },
  onReturnTo3D = () => {},
  onLogout = () => {},
}) {
  const studentName = student?.fullName || student?.name || student?.user_metadata?.full_name || 'Campus Student';
  const rollNo = student?.rollNo || student?.studentId || student?.loginIdentifier || student?.user_metadata?.roll_no || student?.user_metadata?.student_id || '2024CS0842';
  const residency = student?.residencyStatus || student?.residencyType || student?.hostelBlock || student?.hostel || student?.user_metadata?.residency_status || 'Hostler';
  const currentStudentId = student?.id || rollNo;

  const [activeTab, setActiveTab] = useState('rides');

  // Available Academic Blocks for selection
  const academicBlocks = [
    'Academic Block B',
    'Engineering Core (Hall 4)',
    'Science Concourse (Lab 2)',
    'Central Academic Quad',
    'Main Library & Computing Deck',
    'Campus Health & Sports Pavilion'
  ];

  const timeSlotOptions = ['08:30 AM', '10:30 AM', '01:30 PM', '04:30 PM'];
  const durationOptions = [
    { id: '2w', label: '2 Weeks' },
    { id: '1m', label: '1 Month' },
    { id: 'sem', label: 'Semester' }
  ];
  const medicalConditions = [
    'Leg/Ankle Fracture',
    'Ligament Tear / Sprain',
    'Post-Surgery Recovery',
    'Chronic Mobility Condition',
    'Other'
  ];

  // -----------------------------------------------------------
  // 1. PASS REQUESTS & PASS STATE
  // -----------------------------------------------------------
  const [requestsList, setRequestsList] = useState(() => {
    try {
      const stored = localStorage.getItem('qartix_pass_requests');
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  });

  const [routeType, setRouteType] = useState('hostel_class');
  const [academicBlock, setAcademicBlock] = useState(academicBlocks[0]);
  const [selectedSlots, setSelectedSlots] = useState(['08:30 AM', '04:30 PM']);
  const [duration, setDuration] = useState('1m');
  const [medicalCondition, setMedicalCondition] = useState(medicalConditions[0]);
  const [customCondition, setCustomCondition] = useState('');
  const [reason, setReason] = useState('');
  const [uploadedFile, setUploadedFile] = useState(null);
  const [fileError, setFileError] = useState('');
  const [formError, setFormError] = useState('');
  const [submitSuccess, setSubmitSuccess] = useState('');
  const [isSubmittingPass, setIsSubmittingPass] = useState(false);
  const fileInputRef = useRef(null);

  const pickupLocation = routeType === 'hostel_class' ? (student?.hostel || 'Hostel Gate') : 'Main Campus Gate';
  const displayRoute = `${pickupLocation} → ${academicBlock}`;
  const durationObj = durationOptions.find(d => d.id === duration) || durationOptions[1];

  // Check for active or pending pass in Supabase or local storage
  const activePass = requestsList.find(r => r.status === 'approved' || r.status === 'active');
  const pendingPass = requestsList.find(r => r.status === 'pending');
  const latestRequest = activePass || pendingPass || requestsList[0] || null;

  // -----------------------------------------------------------
  // 2. TODAY'S SCHEDULE & SKIP TODAY LOGIC
  // -----------------------------------------------------------
  const [rides, setRides] = useState([
    {
      id: 'ride-1',
      time: '08:30 AM',
      route: `${pickupLocation} → ${academicBlock}`,
      skipped: false,
      raw_status: 'scheduled'
    },
    {
      id: 'ride-2',
      time: '01:30 PM',
      route: `${academicBlock} → Central Quad`,
      skipped: false,
      raw_status: 'scheduled'
    },
    {
      id: 'ride-3',
      time: '04:30 PM',
      route: `Central Quad → ${pickupLocation}`,
      skipped: false,
      raw_status: 'scheduled'
    }
  ]);

  const handleSkipRide = async (rideId) => {
    const target = rides.find(r => r.id === rideId);
    if (!target || target.raw_status === 'completed') return;

    const previousState = [...rides];
    const newSkippedState = !target.skipped;

    setRides(prev =>
      prev.map(r =>
        r.id === rideId
          ? { ...r, skipped: newSkippedState, raw_status: newSkippedState ? 'skipped' : 'scheduled' }
          : r
      )
    );

    if (typeof supabase !== 'undefined' && supabase && newSkippedState) {
      try {
        await supabase.rpc('skip_ride', { p_ride_id: rideId });
      } catch (err) {
        console.warn('Skip ride warning:', err);
      }
    }
  };

  // -----------------------------------------------------------
  // 3. EXTRA RIDE MODAL
  // -----------------------------------------------------------
  const [extraRideModalOpen, setExtraRideModalOpen] = useState(false);
  const [extraPickup, setExtraPickup] = useState(pickupLocation);
  const [extraDrop, setExtraDrop] = useState('Campus Health & Sports Pavilion');
  const [isSubmittingExtra, setIsSubmittingExtra] = useState(false);
  const [extraError, setExtraError] = useState('');

  const handleConfirmExtraRide = async (e) => {
    if (e) e.preventDefault();
    setIsSubmittingExtra(true);
    setExtraError('');

    try {
      if (typeof supabase !== 'undefined' && supabase) {
        const { data, error } = await supabase.rpc('request_extra_ride', {
          p_pickup: extraPickup,
          p_drop: extraDrop,
          p_requested_time: new Date().toISOString()
        });
        if (error) throw new Error(error.message);
      }

      setRides(prev => [
        {
          id: `extra-${Date.now()}`,
          time: 'NOW',
          route: `${extraPickup} → ${extraDrop}`,
          skipped: false,
          raw_status: 'requested'
        },
        ...prev
      ]);
      setExtraRideModalOpen(false);
    } catch (err) {
      setExtraError(err.message || 'Failed to request extra ride. An active approved campus mobility pass is required.');
    } finally {
      setIsSubmittingExtra(false);
    }
  };

  // -----------------------------------------------------------
  // 4. PASS FORM SUBMISSION
  // -----------------------------------------------------------
  const toggleTimeSlot = (slot) => {
    setSelectedSlots(prev => {
      const exists = prev.includes(slot);
      if (exists) {
        return prev.length > 1 ? prev.filter(s => s !== slot) : prev;
      }
      return [...prev, slot];
    });
  };

  const handleFileSelection = (file) => {
    if (!file) return;
    setFileError('');
    setFormError('');

    const MAX_SIZE = 5 * 1024 * 1024; // 5 MB
    if (file.size > MAX_SIZE) {
      setFileError('Medical certificate file size exceeds the 5 MB limit.');
      setUploadedFile(null);
      return;
    }

    const validTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/jpg'];
    if (file.type && !validTypes.includes(file.type)) {
      setFileError('Invalid file format. Only authentic PDF, JPG, or PNG medical documents are accepted.');
      setUploadedFile(null);
      return;
    }

    setUploadedFile(file);
  };

  const handleSubmitPassRequest = async (e) => {
    if (e) e.preventDefault();
    if (isSubmittingPass) return;

    if (!reason.trim()) {
      setFormError('Please specify the reason for your mobility pass request.');
      return;
    }

    if (!uploadedFile) {
      setFormError('Please upload a valid medical certificate or clinic slip.');
      return;
    }

    setIsSubmittingPass(true);
    setFormError('');

    try {
      const newRecord = {
        id: `REQ-${Date.now().toString().slice(-4)}`,
        studentName,
        studentId: currentStudentId,
        route: displayRoute,
        timeSlots: selectedSlots,
        duration: durationObj.label,
        status: 'pending',
        created_at: new Date().toISOString()
      };

      setRequestsList(prev => {
        const updated = [newRecord, ...prev];
        try {
          localStorage.setItem('qartix_pass_requests', JSON.stringify(updated));
        } catch (e) {}
        return updated;
      });

      setSubmitSuccess('PASS SUBMITTED • TRANSPORT OFFICE NOTIFIED');
    } catch (err) {
      setFormError(err.message || 'Failed to submit pass request.');
    } finally {
      setIsSubmittingPass(false);
    }
  };

  const previewStatusText = submitSuccess
    ? 'PASS SUBMITTED • TRANSPORT OFFICE NOTIFIED'
    : activePass
    ? 'ACTIVE'
    : pendingPass
    ? 'PASS SUBMITTED • TRANSPORT OFFICE NOTIFIED'
    : 'DRAFT • NOT SUBMITTED';

  return (
    <div
      style={{
        minHeight: '100vh',
        backgroundColor: '#0B1117',
        color: '#F4F5F7',
        fontFamily: 'Inter, system-ui, -apple-system, sans-serif'
      }}
      className="pb-20"
    >
      {/* ------------------------------------------------------------- */}
      {/* 1. CLEAN TOP HEADER (WITH STUDENT NAME)                      */}
      {/* ------------------------------------------------------------- */}
      <header
        style={{
          backgroundColor: '#0B1117',
          borderBottom: '1px solid rgba(255, 255, 255, 0.08)'
        }}
        className="sticky top-0 z-40 px-6 sm:px-10 py-5"
      >
        <div className="max-w-6xl mx-auto flex items-center justify-between">
          <div>
            <h1 className="text-2xl sm:text-3xl font-bold text-white tracking-tight">
              Hi, {studentName}
            </h1>
            <p className="text-xs sm:text-sm text-slate-400 mt-1">
              {rollNo} • {residency}
            </p>
          </div>

          <div className="flex items-center gap-3">
            <button
              type="button"
              onClick={onReturnTo3D}
              style={{
                backgroundColor: '#161F2C',
                border: '1px solid rgba(255, 255, 255, 0.08)'
              }}
              className="px-3.5 py-2 text-xs sm:text-sm font-medium text-slate-300 hover:text-white rounded-lg transition-colors flex items-center gap-2"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
                <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
                <line x1="12" y1="22.08" x2="12" y2="12" />
              </svg>
              <span>3D Cart View</span>
            </button>

            <button
              type="button"
              onClick={onLogout}
              style={{
                backgroundColor: '#161F2C',
                border: '1px solid rgba(255, 255, 255, 0.08)'
              }}
              className="px-3.5 py-2 text-xs sm:text-sm font-medium text-slate-400 hover:text-red-400 rounded-lg transition-colors"
            >
              Log Out
            </button>
          </div>
        </div>
      </header>

      {/* ------------------------------------------------------------- */}
      {/* 2. SIMPLE 2-TAB LAYOUT                                       */}
      {/* ------------------------------------------------------------- */}
      <div className="max-w-6xl mx-auto px-6 sm:px-10 mt-8 mb-8">
        <div className="flex justify-center">
          <div
            style={{
              backgroundColor: '#161F2C',
              border: '1px solid rgba(255, 255, 255, 0.08)'
            }}
            className="inline-flex p-1 rounded-xl"
          >
            <button
              type="button"
              onClick={() => setActiveTab('rides')}
              className={`px-6 py-2 rounded-lg text-sm font-semibold transition-all ${
                activeTab === 'rides' ? 'bg-[#10B981] text-white shadow-sm' : 'text-slate-400 hover:text-white'
              }`}
            >
              My Rides
            </button>
            <button
              type="button"
              onClick={() => setActiveTab('pass')}
              className={`px-6 py-2 rounded-lg text-sm font-semibold transition-all ${
                activeTab === 'pass' ? 'bg-[#10B981] text-white shadow-sm' : 'text-slate-400 hover:text-white'
              }`}
            >
              Monthly Pass
            </button>
          </div>
        </div>
      </div>

      {/* ------------------------------------------------------------- */}
      {/* 3. TAB 1: MY RIDES (max-w-3xl mx-auto)                       */}
      {/* ------------------------------------------------------------- */}
      {activeTab === 'rides' && (
        <main className="max-w-3xl mx-auto px-6">
          {/* Active Pass Strip (1 compact card) */}
          <div
            style={{
              backgroundColor: '#161F2C',
              border: '1px solid rgba(255, 255, 255, 0.08)'
            }}
            className="rounded-2xl p-5 mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
          >
            <div className="space-y-1">
              <div className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                Active Route
              </div>
              <div className="text-base font-medium text-white flex items-center gap-2">
                <span>{activePass?.route || latestRequest?.route || 'Hostel → Academic Block'}</span>
                <span className="text-slate-500">•</span>
                <span className="text-sm font-mono text-emerald-400">CART-04</span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              {activePass ? (
                <span
                  style={{
                    backgroundColor: 'rgba(16, 185, 129, 0.15)',
                    color: '#10B981',
                    border: '1px solid rgba(16, 185, 129, 0.3)'
                  }}
                  className="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide"
                >
                  ACTIVE
                </span>
              ) : pendingPass ? (
                <span
                  style={{
                    backgroundColor: 'rgba(245, 158, 11, 0.15)',
                    color: '#F59E0B',
                    border: '1px solid rgba(245, 158, 11, 0.3)'
                  }}
                  className="px-3.5 py-1.5 rounded-full text-xs font-bold tracking-wide"
                >
                  PENDING REVIEW
                </span>
              ) : (
                <div className="flex items-center gap-3">
                  <span
                    style={{
                      backgroundColor: 'rgba(255, 255, 255, 0.05)',
                      color: '#94A3B8',
                      border: '1px solid rgba(255, 255, 255, 0.1)'
                    }}
                    className="px-3.5 py-1.5 rounded-full text-xs font-semibold"
                  >
                    NO PASS YET
                  </span>
                  <button
                    type="button"
                    onClick={() => setActiveTab('pass')}
                    className="text-xs font-semibold text-[#10B981] hover:underline"
                  >
                    Apply Now →
                  </button>
                </div>
              )}
            </div>
          </div>

          {/* Today's Schedule (Clean list, generous spacing) */}
          <div className="mb-6">
            <h2 className="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">
              Today's Schedule
            </h2>

            <div className="space-y-3">
              {rides.map(ride => (
                <div
                  key={ride.id}
                  style={{
                    backgroundColor: '#161F2C',
                    border: '1px solid rgba(255, 255, 255, 0.08)',
                    opacity: ride.skipped ? 0.45 : 1
                  }}
                  className="rounded-xl px-5 py-4 flex items-center justify-between gap-4 transition-all"
                >
                  <div
                    className={`font-mono text-base font-semibold min-w-[90px] ${
                      ride.skipped ? 'line-through text-slate-500' : 'text-white'
                    }`}
                  >
                    {ride.time}
                  </div>

                  <div className={`flex-1 text-sm font-medium ${ride.skipped ? 'text-slate-500' : 'text-slate-200'}`}>
                    {ride.route}
                  </div>

                  <button
                    type="button"
                    role="switch"
                    aria-checked={ride.skipped}
                    onClick={() => handleSkipRide(ride.id)}
                    disabled={ride.raw_status === 'completed'}
                    style={{
                      backgroundColor: ride.skipped ? 'rgba(245, 158, 11, 0.1)' : '#0B1117',
                      borderColor: ride.skipped ? 'rgba(245, 158, 11, 0.3)' : 'rgba(255, 255, 255, 0.08)'
                    }}
                    className={`inline-flex items-center gap-2.5 px-3 py-1.5 rounded-lg border text-xs font-medium transition-all ${
                      ride.skipped ? 'text-amber-400' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    <span
                      className={`w-7 h-4 flex items-center rounded-full p-0.5 transition-colors ${
                        ride.skipped ? 'bg-amber-500 justify-end' : 'bg-slate-700 justify-start'
                      }`}
                    >
                      <span className="w-3 h-3 rounded-full bg-white shadow-sm" />
                    </span>
                    <span>{ride.skipped ? 'Skipped' : 'Skip Today'}</span>
                  </button>
                </div>
              ))}
            </div>
          </div>

          {/* Bottom Action: Subtle outlined button */}
          <div className="mt-8 flex justify-center">
            <button
              type="button"
              onClick={() => setExtraRideModalOpen(true)}
              style={{
                backgroundColor: 'transparent',
                border: '1px solid rgba(255, 255, 255, 0.12)'
              }}
              className="px-6 py-2.5 rounded-xl text-sm font-medium text-slate-300 hover:text-[#10B981] hover:border-[#10B981]/50 transition-colors flex items-center gap-2"
            >
              <span className="text-[#10B981] font-semibold text-base leading-none">+</span>
              <span>Request Extra Ride</span>
            </button>
          </div>
        </main>
      )}

      {/* ------------------------------------------------------------- */}
      {/* 4. TAB 2: MONTHLY PASS (max-w-5xl mx-auto)                   */}
      {/* ------------------------------------------------------------- */}
      {activeTab === 'pass' && (
        <main className="max-w-5xl mx-auto px-6">
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            {/* Left: Form Card */}
            <div
              style={{
                backgroundColor: '#161F2C',
                border: '1px solid rgba(255, 255, 255, 0.08)'
              }}
              className="lg:col-span-7 rounded-2xl p-6 sm:p-8 space-y-6"
            >
              <form onSubmit={handleSubmitPassRequest} className="space-y-6">
                {/* 1. Route Type & Academic Block */}
                <div className="space-y-3">
                  <label className="text-xs uppercase tracking-wider font-semibold text-slate-400">
                    Route Type & Academic Block
                  </label>
                  <div className="grid grid-cols-2 gap-3">
                    <button
                      type="button"
                      onClick={() => setRouteType('hostel_class')}
                      style={{
                        backgroundColor: routeType === 'hostel_class' ? 'rgba(16, 185, 129, 0.15)' : '#0B1117',
                        borderColor: routeType === 'hostel_class' ? '#10B981' : 'rgba(255, 255, 255, 0.08)'
                      }}
                      className={`py-2.5 px-3 rounded-xl border text-xs font-semibold transition-all ${
                        routeType === 'hostel_class' ? 'text-[#10B981]' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Hostel → Class
                    </button>
                    <button
                      type="button"
                      onClick={() => setRouteType('gate_class')}
                      style={{
                        backgroundColor: routeType === 'gate_class' ? 'rgba(16, 185, 129, 0.15)' : '#0B1117',
                        borderColor: routeType === 'gate_class' ? '#10B981' : 'rgba(255, 255, 255, 0.08)'
                      }}
                      className={`py-2.5 px-3 rounded-xl border text-xs font-semibold transition-all ${
                        routeType === 'gate_class' ? 'text-[#10B981]' : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      Main Gate → Class
                    </button>
                  </div>

                  <select
                    value={academicBlock}
                    onChange={(e) => setAcademicBlock(e.target.value)}
                    style={{
                      backgroundColor: '#0B1117',
                      borderColor: 'rgba(255, 255, 255, 0.08)'
                    }}
                    className="w-full px-4 py-2.5 rounded-xl border text-sm text-white focus:outline-none focus:border-[#10B981]"
                  >
                    {academicBlocks.map((block) => (
                      <option key={block} value={block} className="bg-[#0B1117]">
                        {block}
                      </option>
                    ))}
                  </select>
                </div>

                {/* 2. Daily Time Slots & Duration */}
                <div className="space-y-4">
                  <div>
                    <label className="text-xs uppercase tracking-wider font-semibold text-slate-400 mb-2 block">
                      Daily Time Slots
                    </label>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                      {timeSlotOptions.map((slot) => {
                        const isSelected = selectedSlots.includes(slot);
                        return (
                          <button
                            key={slot}
                            type="button"
                            onClick={() => toggleTimeSlot(slot)}
                            style={{

                    <span className="text-xs font-mono tracking-wider uppercase text-slate-300 font-semibold">
                      QARTIX MOBILITY PASS
                    </span>
                  </div>
                  <span className="text-xs font-mono text-slate-500">
                    {latestRequest?.id || 'DIGITAL PASS'}
                  </span>
                </div>

                <div className="space-y-4">
                  <div>
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-medium">Student Name</div>
                    <div className="text-xl font-bold text-white mt-0.5">{studentName}</div>
                  </div>

                  <div>
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-medium">Route</div>

                  </div>

                  <div>
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-medium">Timings</div>
                    <div className="text-sm font-mono text-emerald-400 font-semibold mt-0.5">{selectedSlots.join(' • ')}</div>
                  </div>

                  <div>
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-medium">Duration</div>
                    <div className="text-sm font-semibold text-slate-200 mt-0.5">{durationObj.label}</div>
                  </div>

                  <div className="pt-2 border-t border-white/5">
                    <div className="text-xs uppercase tracking-wider text-slate-400 font-medium mb-1.5">Pass Status</div>

                        backgroundColor:
                          previewStatusText === 'ACTIVE'
                            ? 'rgba(16, 185, 129, 0.15)'
                            : previewStatusText.includes('SUBMITTED')

                            : 'rgba(255, 255, 255, 0.05)',
                        color:
                          previewStatusText === 'ACTIVE' || previewStatusText.includes('SUBMITTED')
                            ? '#10B981'
                            : '#94A3B8',
                        border: `1px solid ${
                          previewStatusText === 'ACTIVE' || previewStatusText.includes('SUBMITTED')
                            ? 'rgba(16, 185, 129, 0.3)'

                </div>
              </div>
            </div>
          </div>
        </main>
      )}

      {/* Extra Ride Modal */}
      {extraRideModalOpen && (

                  type="text"
                  value={extraPickup}
                  onChange={(e) => setExtraPickup(e.target.value)}

                    backgroundColor: '#0B1117',
                    borderColor: 'rgba(255, 255, 255, 0.08)'

              <div>
                <label className="text-xs uppercase tracking-wider text-slate-400 font-semibold block mb-1.5">
                  Destination
                </label>
                <select
                  value={extraDrop}
                  onChange={(e) => setExtraDrop(e.target.value)}
                  style={{
                    backgroundColor: '#0B1117',
                    borderColor: 'rgba(255, 255, 255, 0.08)'
                  }}
                  className="w-full px-4 py-2 rounded-xl border text-sm text-white focus:outline-none focus:border-[#10B981]"
                >
                  {academicBlocks.map((b) => (
                    <option key={b} value={b} className="bg-[#0B1117]">
                      {b}
                    </option>
                  ))}
                </select>
              </div>

              {extraError && <p className="text-xs text-red-400 font-medium">{extraError}</p>}

              <div className="flex gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => setExtraRideModalOpen(false)}
                  style={{
                    backgroundColor: '#0B1117',
                    border: '1px solid rgba(255, 255, 255, 0.08)'

                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={isSubmittingExtra}
                  style={{ backgroundColor: '#10B981' }}
                  className="flex-1 py-2.5 rounded-xl text-xs font-bold text-white hover:bg-[#059669] transition-all disabled:opacity-50"
                >

                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}


function AdminInterface({ admin = { fullName: 'Transport Officer' }, onLogout = () => {} }) {
  const [activeTab, setActiveTab] = useState('passes'); // 'passes' | 'drivers' | 'fleet'
  const [passRequests, setPassRequests] = useState([]);
  const [drivers, setDrivers] = useState([]);
  const [carts, setCarts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [actionMsg, setActionMsg] = useState('');
  const [selectedDoc, setSelectedDoc] = useState(null);

  const loadData = async () => {
    setLoading(true);
    try {
      if (supabase) {
        const { data: passes } = await supabase.from('pass_requests').select('*').order('created_at', { ascending: false });
        if (passes) setPassRequests(passes);

        const { data: drvs } = await supabase.from('profiles').select('*').eq('role', 'driver').order('created_at', { ascending: false });
        if (drvs) setDrivers(drvs);

        const { data: crts } = await supabase.from('carts').select('*').order('cart_number');
        if (crts) setCarts(crts);
      }
    } catch (e) {
      console.error('Error loading admin data:', e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    loadData();
  }, []);

  const showNotification = (msg) => {
    setActionMsg(msg);
    setTimeout(() => setActionMsg(''), 4000);
  };

  const handleReviewPass = async (requestId, newStatus) => {
    try {
      if (supabase) {
        const { error } = await supabase.from('pass_requests').update({
          status: newStatus,
          reviewed_at: new Date().toISOString(),
          admin_notes: newStatus === 'approved' ? 'Approved by Transport Office' : 'Rejected - please provide updated documentation.',
        }).eq('id', requestId);
        if (error) throw error;
      }
      setPassRequests((prev) => prev.map((p) => (p.id === requestId ? { ...p, status: newStatus } : p)));
      showNotification(`Pass ${requestId} has been marked as ${newStatus.toUpperCase()}.`);
    } catch (err) {
      alert('Failed to update pass request: ' + err.message);
    }
  };

  const handleToggleDriverApproval = async (driverProfileId, currentStatus) => {
    try {
      const nextStatus = !currentStatus;
      if (supabase) {
        const { error } = await supabase.from('profiles').update({ driver_approved: nextStatus }).eq('id', driverProfileId);
        if (error) throw error;
      }
      setDrivers((prev) => prev.map((d) => (d.id === driverProfileId ? { ...d, driver_approved: nextStatus } : d)));
      showNotification(`Driver status updated to ${nextStatus ? 'APPROVED' : 'PENDING'}.`);
    } catch (err) {
      alert('Failed to update driver: ' + err.message);
    }
  };

  const handleAssignCart = async (cartNumber, driverId) => {
    try {
      const assignedVal = driverId === '' ? null : driverId;
      if (supabase) {
        const { error } = await supabase.from('carts').update({ assigned_driver_id: assignedVal }).eq('cart_number', cartNumber);
        if (error) throw error;
      }
      setCarts((prev) => prev.map((c) => (c.cart_number === cartNumber ? { ...c, assigned_driver_id: assignedVal } : c)));
      showNotification(`Cart ${cartNumber} assignment updated.`);
    } catch (err) {
      alert('Failed to assign cart: ' + err.message);
    }
  };

  return (
    <div
      style={{
        minHeight: '100vh',
        backgroundColor: '#13161B',
        backgroundImage: 'radial-gradient(circle at 60% 30%, #242A34 0%, #13161B 80%)',
        color: '#F4F5F7',
        fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
        paddingBottom: '60px',
      }}
    >
      {actionMsg && (
        <div
          style={{
            position: 'fixed',
            top: '80px',
            right: '24px',
            zIndex: 9999,
            background: '#1C2128',
            color: '#10B981',
            border: '1px solid #10B981',
            borderRadius: '8px',
            padding: '12px 20px',
            boxShadow: '0 8px 24px rgba(0,0,0,0.5)',
            fontSize: '13px',
            fontWeight: 600,
          }}
        >
          {actionMsg}
        </div>
      )}

      <header
        style={{
          position: 'sticky',
          top: 0,
          zIndex: 50,
          height: '68px',
          padding: '0 32px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'space-between',
          background: 'rgba(28, 33, 40, 0.92)',
          backdropFilter: 'blur(16px)',
          borderBottom: '1px solid rgba(255, 255, 255, 0.12)',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
          <div
            style={{
              width: '36px',
              height: '36px',
              borderRadius: '8px',
              background: '#13161B',
              border: '1px solid rgba(255, 255, 255, 0.12)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              color: '#10B981',
              fontWeight: 800,
              fontSize: '18px',
            }}
          >
            Q
          </div>
          <div>
            <div style={{ fontSize: '15px', fontWeight: 700, letterSpacing: '0.02em', color: '#F4F5F7' }}>
              QARTIX TRANSPORT OFFICE
            </div>
            <div style={{ fontSize: '11px', color: '#9CA3AF' }}>

        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>

                        <strong style={{ color: '#F4F5F7' }}>
                          {Array.isArray(req.time_slots) ? req.time_slots.join(', ') : 'Daily Scheduled'}
                        </strong>
                      </div>
                    </div>

                    <div style={{ fontSize: '12px', color: '#D1D5DB' }}>
                      <span style={{ color: '#9CA3AF' }}>Medical Reason: </span>
                      {req.reason}
                    </div>

                    <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginTop: '4px' }}>
                      <span style={{ fontSize: '12px', color: '#9CA3AF' }}>Medical Document:</span>
                      <span
                        style={{
                          fontSize: '12px',
                          color: '#38BDF8',
                          textDecoration: 'underline',
                          cursor: 'pointer',
                        }}
                        onClick={() =>
                          setSelectedDoc({
                            name: req.certificate_name,
                            url: req.certificate_url,
                            size: req.certificate_size,
                          })
                        }
                      >
                        📄 {req.certificate_name || 'certificate.pdf'} ({req.certificate_size || 'Attached'})
                      </span>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {!loading && activeTab === 'drivers' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h2 style={{ fontSize: '18px', fontWeight: 700 }}>Driver Accounts & Clearance</h2>
              <button
                onClick={loadData}
                style={{
                  background: 'rgba(255,255,255,0.06)',
                  color: '#D1D5DB',
                  border: '1px solid rgba(255,255,255,0.1)',
                  padding: '6px 12px',
                  borderRadius: '6px',
                  fontSize: '12px',
                  cursor: 'pointer',
                }}
              >
                Refresh
              </button>
            </div>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {drivers.map((drv) => (
                <div
                  key={drv.id}
                  style={{
                    background: '#1C2128',
                    border: '1px solid rgba(255, 255, 255, 0.1)',
                    borderRadius: '10px',
                    padding: '16px 20px',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                  }}
                >
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                      <span style={{ fontSize: '15px', fontWeight: 700 }}>{drv.full_name || 'Driver'}</span>
                      <span
                        style={{
                          fontSize: '11px',
                          fontFamily: 'JetBrains Mono, monospace',
                          padding: '2px 8px',
                          borderRadius: '4px',
                          background: 'rgba(255,255,255,0.08)',
                          color: '#9CA3AF',
                        }}
                      >
                        {drv.driver_id || 'CART-OPERATOR'}
                      </span>
                      <span
                        style={{
                          fontSize: '11px',
                          padding: '2px 8px',
                          borderRadius: '4px',
                          fontWeight: 700,
                          background: drv.driver_approved
                            ? 'rgba(16, 185, 129, 0.15)'
                            : 'rgba(245, 158, 11, 0.15)',
                          color: drv.driver_approved ? '#10B981' : '#FBBF24',
                        }}
                      >
                        {drv.driver_approved ? 'APPROVED' : 'PENDING CLEARANCE'}
                      </span>
                    </div>
                    <div style={{ fontSize: '12px', color: '#9CA3AF', marginTop: '4px' }}>
                      Email: {drv.email} • Mobile: {drv.phone || 'N/A'} • Status:{' '}
                      {drv.is_online ? '🟢 Online' : '⚪ Offline'}
                    </div>
                  </div>

                  <button
                    onClick={() => handleToggleDriverApproval(drv.id, drv.driver_approved)}
                    style={{
                      background: drv.driver_approved ? 'rgba(239, 68, 68, 0.15)' : '#10B981',
                      color: drv.driver_approved ? '#F87171' : '#04100C',
                      border: drv.driver_approved ? '1px solid rgba(239,68,68,0.3)' : 'none',
                      padding: '8px 16px',
                      borderRadius: '6px',
                      fontSize: '12px',
                      fontWeight: 700,
                      cursor: 'pointer',
                    }}
                  >
                    {drv.driver_approved ? 'Revoke Approval' : 'Approve Driver Account'}
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {!loading && activeTab === 'fleet' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h2 style={{ fontSize: '18px', fontWeight: 700 }}>Campus EV Cart Fleet & Telemetry</h2>
              <button
                onClick={loadData}
                style={{
                  background: 'rgba(255,255,255,0.06)',
                  color: '#D1D5DB',
                  border: '1px solid rgba(255,255,255,0.1)',
                  padding: '6px 12px',
                  borderRadius: '6px',
                  fontSize: '12px',
                  cursor: 'pointer',
                }}
              >
                Refresh
              </button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: '16px' }}>
              {carts.map((c) => (
                <div
                  key={c.id}
                  style={{
                    background: '#1C2128',
                    border: '1px solid rgba(255, 255, 255, 0.1)',
                    borderRadius: '12px',
                    padding: '20px',
                    display: 'flex',
                    flexDirection: 'column',
                    gap: '14px',
                  }}
                >
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                      <span
                        style={{
                          width: '10px',
                          height: '10px',
                          borderRadius: '50%',
                          background: c.status === 'online' ? '#10B981' : '#6B7280',
                          boxShadow: c.status === 'online' ? '0 0 8px #10B981' : 'none',
                        }}
                      />
                      <span style={{ fontSize: '16px', fontWeight: 700 }}>{c.cart_number}</span>
                    </div>
                    <span
                      style={{
                        fontSize: '11px',
                        padding: '2px 8px',
                        borderRadius: '4px',
                        fontWeight: 600,
                        background: 'rgba(255,255,255,0.08)',
                        color: '#9CA3AF',
                        textTransform: 'uppercase',
                      }}
                    >
                      {c.status}
                    </span>
                  </div>

                  <div style={{ fontSize: '12px', color: '#9CA3AF' }}>
                    <div>
                      Station: <strong style={{ color: '#F4F5F7' }}>{c.current_station}</strong>
                    </div>
                    <div style={{ marginTop: '4px' }}>
                      Speed: <strong style={{ color: '#10B981' }}>{c.speed_kmh} km/h</strong> • Route:{' '}
                      <strong style={{ color: '#F4F5F7' }}>{c.route_label}</strong>
                    </div>
                  </div>

                  <div style={{ marginTop: '6px' }}>
                    <label style={{ fontSize: '11px', color: '#9CA3AF', display: 'block', marginBottom: '4px' }}>
                      Assigned Driver:
                    </label>
                    <select
                      value={c.assigned_driver_id || ''}
                      onChange={(e) => handleAssignCart(c.cart_number, e.target.value)}
                      style={{
                        width: '100%',
                        background: '#13161B',
                        border: '1px solid rgba(255, 255, 255, 0.15)',
                        color: '#F4F5F7',
                        padding: '8px 10px',
                        borderRadius: '6px',
                        fontSize: '12px',
                      }}
                    >
                      <option value="">-- No Driver Assigned --</option>
                      {drivers.map((d) => (
                        <option key={d.id} value={d.id}>
                          {d.full_name} ({d.driver_id || d.email})
                        </option>
                      ))}
                    </select>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </main>

      {selectedDoc && (
        <div
          style={{
            position: 'fixed',
            inset: 0,
            zIndex: 10000,
            background: 'rgba(0, 0, 0, 0.8)',
            backdropFilter: 'blur(8px)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '20px',
          }}
        >
          <div
            style={{
              background: '#1C2128',
              border: '1px solid rgba(255, 255, 255, 0.15)',
              borderRadius: '12px',
              maxWidth: '560px',
              width: '100%',
              padding: '24px',
            }}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
              <h3 style={{ fontSize: '16px', fontWeight: 700 }}>Medical Certificate Document</h3>
              <button
                onClick={() => setSelectedDoc(null)}
                style={{
                  background: 'none',
                  border: 'none',
                  color: '#9CA3AF',
                  fontSize: '20px',
                  cursor: 'pointer',
                }}
              >
                ×
              </button>
            </div>
            <div
              style={{
                background: '#13161B',
                borderRadius: '8px',
                padding: '24px',
                textAlign: 'center',
                marginBottom: '20px',
                border: '1px dashed rgba(255,255,255,0.2)',
              }}
            >
              <div style={{ fontSize: '36px', marginBottom: '12px' }}>📄</div>
              <div style={{ fontSize: '14px', fontWeight: 600 }}>{selectedDoc.name}</div>
              <div style={{ fontSize: '12px', color: '#9CA3AF', marginTop: '4px' }}>
                Verified Orthopedic / Clinic Certificate ({selectedDoc.size || 'PDF Document'})
              </div>
              {selectedDoc.url && (
                <div style={{ marginTop: '16px' }}>
                  <a
                    href={selectedDoc.url}
                    target="_blank"
                    rel="noreferrer"
                    style={{
                      display: 'inline-block',
                      background: '#10B981',
                      color: '#04100C',
                      padding: '8px 16px',
                      borderRadius: '6px',
                      textDecoration: 'none',
                      fontSize: '12px',
                      fontWeight: 700,
                    }}
                  >
                    Open Document in New Tab
                  </a>
                </div>
              )}
            </div>
            <button
              onClick={() => setSelectedDoc(null)}
              style={{
                width: '100%',
                background: 'rgba(255, 255, 255, 0.08)',
                color: '#F4F5F7',
                border: 'none',
                padding: '10px',
                borderRadius: '6px',
                fontSize: '13px',
                fontWeight: 600,
                cursor: 'pointer',
              }}
            >
              Close Preview
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    // =========================================================
    // 4. MAIN APP ROUTER
    // =========================================================

function App() {
  // Authentication State: null | { role: 'student' | 'driver' | 'admin', id, fullName, ... }
  const [currentUser, setCurrentUser] = useState(null);
  const [studentView, setStudentView] = useState('landing'); // 'landing' | 'dashboard'
  const [welcomeToast, setWelcomeToast] = useState(null);

  // Restore Supabase session on initial mount
  useEffect(() => {
    if (!supabase) return;
    let isMounted = true;
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (!isMounted || !session?.user) return;
      supabase.from('profiles').select('*').eq('id', session.user.id).single().then(({ data: profile }) => {
        if (!isMounted || !profile) return;
        setCurrentUser({
          id: session.user.id,
          email: session.user.email,
          role: profile.role || 'student',
          fullName: profile.full_name || 'Campus Rider',
          phone: profile.phone || '',
          studentId: profile.student_id || '',
          driverId: profile.driver_id || '',
          cartNumber: profile.driver_id || 'CART-04',
          residencyStatus: profile.residency_status || 'Hostler',
          hostelBlock: profile.hostel_block || 'Hostel Resident',
          driverApproved: profile.driver_approved,
        });
      }).catch(() => {});
    }).catch(() => {});
    return () => {
      isMounted = false;
    };
  }, []);

  // Auto-dismiss welcome toast after 4 seconds
  useEffect(() => {
    if (welcomeToast) {
      const timer = setTimeout(() => {
        setWelcomeToast(null);
      }, 4000);
      return () => clearTimeout(timer);
    }
  }, [welcomeToast]);

  // Handle successful login/signup from AuthPage
  const handleAuthenticate = ({ role, user }) => {
    setCurrentUser({
      role,
      ...user,
    });
    setStudentView('landing');

    // Craft contextual welcome message
    let message = '';
    if (role === 'admin') {
      message = `Welcome to Transport Office Admin Console, ${user.fullName || 'Admin'}!`;
    } else if (role === 'student') {
      const name = user.fullName || 'Student';
      if (user.mode === 'signup') {
        message = `Welcome to Qartix, ${name}! Your student account is ready.`;
      } else {
        message = `Welcome back, ${name}! Ready for your campus ride?`;
      }
    } else if (role === 'driver') {
      const driverIdent = user.fullName || user.cartNumber || user.id || 'Operator';
      message = `Welcome, Driver ${driverIdent}! Have a safe shift.`;
    }
    setWelcomeToast(message);
  };

  // Handle Logout from any interface
  const handleLogout = async () => {
    if (supabase) {
      await supabase.auth.signOut().catch(() => {});
    }
    setCurrentUser(null);
    setStudentView('landing');
    setWelcomeToast(null);
  };

  // 1. Initial Screen: AuthPage
  if (!currentUser) {
    return <AuthPage onAuthenticate={handleAuthenticate} />;
  }

  // 2. Pending Driver Approval Protection Screen
  if (currentUser.role === 'driver' && (!currentUser.driverApproved && currentUser.status === 'pending_approval')) {
    return (
      <div
        style={{
          minHeight: '100vh',
          width: '100%',
          backgroundColor: '#13161B',
          backgroundImage: 'radial-gradient(circle at 50% 35%, #242A34 0%, #13161B 75%)',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          padding: '24px',
          color: '#F4F5F7',
          fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
          textAlign: 'center',
        }}
      >
        <div
          style={{
            maxWidth: '460px',
            width: '100%',
            backgroundColor: '#1C2128',
            border: '1px solid rgba(245, 158, 11, 0.4)',
            borderRadius: '16px',
            padding: '36px 28px',
            boxShadow: '0 16px 40px rgba(0, 0, 0, 0.6)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
          }}
        >
          <div
            style={{
              width: '60px',
              height: '60px',
              borderRadius: '50%',
              backgroundColor: 'rgba(245, 158, 11, 0.15)',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              marginBottom: '18px',
              border: '1px solid #F59E0B',
            }}
          >
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
          </div>
          <h2 style={{ fontSize: '18px', fontWeight: 800, color: '#FCD34D', margin: '0 0 10px 0' }}>
            Awaiting Transport Office Approval
          </h2>
          <p style={{ fontSize: '13px', color: '#9CA3AF', lineHeight: 1.55, margin: '0 0 24px 0' }}>
            Your driver account (<strong style={{ color: '#F4F5F7' }}>{currentUser.cartNumber || currentUser.driverId}</strong>) has been registered and is pending verification by the campus transport office. Driver Cockpit access will be unlocked once approved.
          </p>
          <button
            type="button"
            onClick={handleLogout}
            style={{
              padding: '10px 24px',
              borderRadius: '8px',
              backgroundColor: '#13161B',
              border: '1px solid rgba(255, 255, 255, 0.15)',
              color: '#F4F5F7',
              fontSize: '13px',
              fontWeight: 700,
              cursor: 'pointer',
            }}
          >
            Log Out & Return
          </button>
        </div>
      </div>
    );
  }

  // 3. Admin Area Protection Screen (If visiting /admin as non-admin)
  const isPathAdmin = typeof window !== 'undefined' && (window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin'));
  if (isPathAdmin && currentUser.role !== 'admin') {
    return (
      <div
        style={{
          minHeight: '100vh',
          width: '100%',
          backgroundColor: '#13161B',
          backgroundImage: 'radial-gradient(circle at 50% 35%, #242A34 0%, #13161B 75%)',
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          padding: '24px',
          color: '#F4F5F7',
          fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
          textAlign: 'center',
        }}
      >
        <div
          style={{
            maxWidth: '500px',
            width: '100%',
            backgroundColor: '#1C2128',
            border: '1px solid rgba(239, 68, 68, 0.4)',
            borderRadius: '16px',
            padding: '40px 32px',
            boxShadow: '0 20px 48px rgba(0, 0, 0, 0.7)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
          }}
        >
          <div
            style={{
              fontSize: '11px',
              fontWeight: 800,
              color: '#EF4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              padding: '4px 10px',
              borderRadius: '6px',
              border: '1px solid rgba(239, 68, 68, 0.25)',
              marginBottom: '12px',
            }}
          >
            403 • ACCESS RESTRICTED
          </div>
          <h2 style={{ fontSize: '20px', fontWeight: 800, color: '#F4F5F7', margin: '0 0 10px 0' }}>
            Transport Office Access Only
          </h2>
          <p style={{ fontSize: '13px', color: '#9CA3AF', lineHeight: 1.6, margin: '0 0 24px 0' }}>
            The /admin console is restricted to university fleet administrators. Your current session is authenticated as {currentUser.fullName || currentUser.email} with role {currentUser.role?.toUpperCase()}.
          </p>
          <div style={{ display: 'flex', gap: '12px', width: '100%' }}>
            <button
              type="button"
              onClick={() => {
                if (typeof window !== 'undefined') {
                  window.history.pushState({}, '', '/');
                  window.location.reload();
                }
              }}
              style={{
                flex: 1,
                padding: '11px 16px',
                borderRadius: '8px',
                backgroundColor: '#10B981',
                border: 'none',
                color: '#04100C',
                fontSize: '13px',
                fontWeight: 800,
                cursor: 'pointer',
              }}
            >
              Return to Dashboard
            </button>
            <button
              type="button"
              onClick={handleLogout}
              style={{
                padding: '11px 18px',
                borderRadius: '8px',
                backgroundColor: '#13161B',
                border: '1px solid rgba(255, 255, 255, 0.15)',
                color: '#F4F5F7',
                fontSize: '13px',
                fontWeight: 700,
                cursor: 'pointer',
              }}
            >
              Sign Out
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <>
      <style>{`
        @keyframes qartixSlideDown {
          0% {
            transform: translate(-50%, -24px);
            opacity: 0;
          }
          100% {
            transform: translate(-50%, 0);
            opacity: 1;
          }
        }
      `}</style>

      {/* Sleek Auto-Dismissing Welcome Toast / Banner */}
      {Boolean(welcomeToast) && typeof welcomeToast === 'string' && welcomeToast.trim().length > 0 ? (
        <div
          id="qartix-welcome-toast"
          style={{
            position: 'fixed',
            top: '84px',
            left: '50%',
            transform: 'translateX(-50%)',
            zIndex: 9999,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '16px',
            backgroundColor: '#1C2128',
            color: '#F4F5F7',
            padding: '12px 18px',
            borderRadius: '10px',
            border: '1px solid rgba(255, 255, 255, 0.15)',
            borderLeft: '4px solid #10B981',
            boxShadow: '0 12px 28px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(16, 185, 129, 0.15)',
            animation: 'qartixSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            maxWidth: '92vw',
            fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
          }}
        >
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
            <span
              style={{
                width: '8px',
                height: '8px',
                borderRadius: '50%',
                backgroundColor: '#10B981',
                boxShadow: '0 0 10px #10B981',
                flexShrink: 0,
              }}
            />
            <span style={{ fontSize: '13px', fontWeight: 600, letterSpacing: '0.01em', color: '#F4F5F7' }}>
              {welcomeToast}
            </span>
          </div>

          <button
            type="button"
            onClick={() => setWelcomeToast(null)}
            style={{
              width: '24px',
              height: '24px',
              minWidth: '24px',
              minHeight: '24px',
              borderRadius: '50%',
              backgroundColor: 'rgba(255, 255, 255, 0.08)',
              border: '1px solid rgba(255, 255, 255, 0.12)',
              color: '#9CA3AF',
              cursor: 'pointer',
              fontSize: '15px',
              fontWeight: 700,
              lineHeight: 1,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              padding: 0,
              transition: 'all 0.15s ease',
              flexShrink: 0,
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.backgroundColor = 'rgba(255, 255, 255, 0.16)';
              e.currentTarget.style.color = '#FFFFFF';
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
              e.currentTarget.style.color = '#9CA3AF';
            }}
            aria-label="Close notification"
            title="Close"
          >
            ×
          </button>
        </div>
      ) : null}

      {/* 2. Admin Interface (Transport Office) */}
      {currentUser.role === 'admin' && (
        <AdminInterface
          admin={currentUser}
          onLogout={handleLogout}
        />
      )}

      {/* 3. Driver Interface */}
      {currentUser.role === 'driver' && (
        <DriverInterface
          driver={currentUser}
          onLogout={handleLogout}
        />
      )}

      {/* 4. Student Interface: Pass Builder & Today's Schedule Dashboard */}
      {currentUser.role === 'student' && studentView === 'dashboard' && (
        <StudentDashboard
          student={currentUser}
          onReturnTo3D={() => setStudentView('landing')}
          onLogout={handleLogout}
        />
      )}

      {/* 5. Default Student Interface: 3D WebGL Scroll Experience */}
      {currentUser.role === 'student' && studentView === 'landing' && (
        <StudentLanding
          studentId={currentUser.id}
          onBookPass={() => setStudentView('dashboard')}
          onLogout={handleLogout}
        />
      )}
    </>
  );
}

    // Render to DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>

</html>
