<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qartix — Campus EV Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background-color: #13161B;
      color: #F4F5F7;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-text-fill-color: #F4F5F7 !important;
      -webkit-box-shadow: 0 0 0px 1000px #13161B inset !important;
      transition: background-color 5000s ease-in-out 0s !important;
    }
  </style>
  <!-- React & Three.js via CDN for Instant Standalone Verification -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Supabase Public Configuration & Client
    const SUPABASE_URL = 'https://arbwqtudubtyxufbjojq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyYndxdHVkdWJ0eXh1ZmJqb2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MTk3MjcsImV4cCI6MjEwODQ5NTcyN30.cOkLai5YpcN2d_FOidjkwGKoAweXn3YAVoFA2ERW5QA';
    const supabase = (typeof window !== 'undefined' && window.supabase)
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { persistSession: true, autoRefreshToken: true }
        })
      : null;

    function normalizeStudentEmail(identifier) {
      const clean = (identifier || '').trim().toLowerCase();
      if (clean.includes('@')) return clean;
      return `${clean.replace(/[^a-z0-9_-]/g, '')}@qartix.campus`;
    }

    function normalizeDriverEmail(driverId) {
      const clean = (driverId || '').trim().toLowerCase();
      if (clean.includes('@')) return clean;
      return `${clean.replace(/[^a-z0-9_-]/g, '')}@driver.qartix.campus`;
    }

    function normalizeDriverPin(pin) {
      const p = (pin || '').trim();
      if (p === '4021') return 'driverPin4021';
      if (p.length < 6) return `${p}_qartix_driver`;
      return p;
    }

    // =========================================================
    // 1. AUTHPAGE COMPONENT
    // =========================================================

/**
 * AuthPage Component
 * The entry point for Qartix: Split-screen architectural transit authentication.
 * 
 * @param {Function} onAuthenticate - Callback invoked on successful login/signup: ({ role, user }) => void
 */
function AuthPage({ onAuthenticate = () => {} }) {
  // Role: 'student' | 'driver'
  const [role, setRole] = useState('student');
  // Mode: 'login' | 'signup'
  const [mode, setMode] = useState('login');

  // Form State
  const [formData, setFormData] = useState({
    // Common / Student
    identifier: '', // Roll No or Email
    password: '',
    fullName: '',
    residencyStatus: 'Hostler', // 'Hostler' | 'Day Scholar'
    phone: '',
    // Driver
    driverId: '',   // Cart Number or Driver ID
    pin: '',
  });

  const [errorMsg, setErrorMsg] = useState('');

  // Handle Input Change
  const handleChange = (e) => {
    const { name, value } = e.target;
    setFormData((prev) => ({ ...prev, [name]: value }));
    if (errorMsg) setErrorMsg('');
  };

  // Quick Demo Fill Handler
  const handleQuickDemoFill = () => {
    if (role === 'student') {
      setFormData({
        identifier: 'STU-84920',
        password: 'studentPassword123',
        fullName: 'Pranav Kumar',
        residencyStatus: 'Hostler',
        phone: '+91 98765 43210',
        driverId: '',
        pin: '',
      });
    } else {
      // Driver
      setFormData({
        identifier: '',
        password: '',
        fullName: 'Vikram Singh',
        residencyStatus: 'Hostler',
        driverId: 'CART-04',
        pin: '4021',
        phone: '+91 98765 43210',
      });
    }
    setErrorMsg('');
  };

  // Switch Role
  const handleRoleChange = (newRole) => {
    setRole(newRole);
    setErrorMsg('');
  };

  // Switch Mode
  const handleModeChange = (newMode) => {
    setMode(newMode);
    setErrorMsg('');
  };

  const [isSubmitting, setIsSubmitting] = useState(false);

  // Submit Handler
  const handleSubmit = async (e) => {
    e.preventDefault();
    setErrorMsg('');

    if (role === 'student') {
      const id = formData.identifier.trim();
      const pwd = formData.password.trim();
      if (!id) {
        setErrorMsg('Please enter your University Roll No. or Email.');
        return;
      }
      if (!pwd) {
        setErrorMsg('Please enter your password.');
        return;
      }
      if (mode === 'signup') {
        if (!formData.fullName.trim()) {
          setErrorMsg('Please enter your full name.');
          return;
        }
        const digits = formData.phone.replace(/\D/g, '');
        if (digits.length < 10) {
          setErrorMsg('Please enter a valid 10-digit mobile number.');
          return;
        }
      }

      setIsSubmitting(true);
      try {
        if (supabase) {
          const email = normalizeStudentEmail(id);
          let authUser = null;
          let profile = null;

          if (mode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email,
              password: pwd,
              options: {
                data: {
                  role: 'student',
                  fullName: formData.fullName.trim(),
                  phone: formData.phone.trim(),
                  studentId: id.toUpperCase(),
                  residencyStatus: formData.residencyStatus,
                },
              },
            });
            if (error) throw new Error(error.message);
            authUser = data.user;
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email,
              password: pwd,
            });
            if (error || !data?.user) throw new Error('Invalid credentials. Please verify your details.');
            authUser = data.user;
          }

          if (authUser) {
            const { data: p } = await supabase.from('profiles').select('*').eq('id', authUser.id).single();
            profile = p;
          }

          const verifiedRole = profile?.role || 'student';
          onAuthenticate({
            role: verifiedRole,
            user: {
              id: profile?.id || id.toUpperCase(),
              email: authUser?.email || email,
              fullName: profile?.full_name || formData.fullName.trim() || 'Student User',
              residencyStatus: profile?.residency_status || formData.residencyStatus || 'Hostler',
              hostelBlock: profile?.hostel_block || (formData.residencyStatus === 'Hostler' ? 'Hostel Resident' : 'Day Scholar'),
              phone: profile?.phone || formData.phone.trim() || '+91 98765 43210',
              studentId: profile?.student_id || id.toUpperCase(),
              mode,
            },
          });
          return;
        }

        // Fallback if offline
        onAuthenticate({
          role: 'student',
          user: {
            id: id.toUpperCase(),
            fullName: formData.fullName.trim() || 'Student User',
            residencyStatus: formData.residencyStatus || 'Hostler',
            hostelBlock: formData.residencyStatus === 'Hostler' ? 'Hostel Resident' : 'Day Scholar',
            phone: formData.phone.trim() || '+91 98765 43210',
            mode,
          },
        });
      } catch (err) {
        setErrorMsg(err.message || 'Invalid credentials. Please verify your details.');
      } finally {
        setIsSubmitting(false);
      }
    } else {
      // Driver
      const cartOrDriver = formData.driverId.trim();
      const pin = formData.pin.trim();
      if (!cartOrDriver) {
        setErrorMsg('Please enter your Driver ID or Cart Number (e.g. CART-04).');
        return;
      }
      if (!pin) {
        setErrorMsg('Please enter your Security PIN / Password.');
        return;
      }
      if (mode === 'signup') {
        if (!formData.fullName.trim()) {
          setErrorMsg('Please enter your full name.');
          return;
        }
        const digits = formData.phone.replace(/\D/g, '');
        if (digits.length < 10) {
          setErrorMsg('Please enter a valid 10-digit mobile number.');
          return;
        }
      }

      setIsSubmitting(true);
      try {
        if (supabase) {
          const email = normalizeDriverEmail(cartOrDriver);
          const pwd = normalizeDriverPin(pin);
          let authUser = null;
          let profile = null;

          if (mode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email,
              password: pwd,
              options: {
                data: {
                  role: 'driver',
                  fullName: formData.fullName.trim(),
                  phone: formData.phone.trim(),
                  driverId: cartOrDriver.toUpperCase(),
                },
              },
            });
            if (error) throw new Error(error.message);
            authUser = data.user;
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email,
              password: pwd,
            });
            if (error || !data?.user) throw new Error('Invalid credentials. Please verify your details.');
            authUser = data.user;
          }

          if (authUser) {
            const { data: p } = await supabase.from('profiles').select('*').eq('id', authUser.id).single();
            profile = p;
          }

          if (profile?.role === 'driver' && !profile.driver_approved) {
            throw new Error('Your driver account is pending Transport Office approval.');
          }

          const verifiedRole = profile?.role || 'driver';
          onAuthenticate({
            role: verifiedRole,
            user: {
              id: profile?.id || cartOrDriver.toUpperCase(),
              cartNumber: cartOrDriver.toUpperCase().includes('CART') ? cartOrDriver.toUpperCase() : `CART-${cartOrDriver}`,
              driverId: profile?.driver_id || cartOrDriver.toUpperCase(),
              fullName: profile?.full_name || formData.fullName.trim() || 'Campus Operator',
              phone: profile?.phone || formData.phone.trim() || '+91 98765 43210',
              driverApproved: profile?.driver_approved,
              mode,
            },
          });
          return;
        }

        // Fallback
        onAuthenticate({
          role: 'driver',
          user: {
            id: cartOrDriver.toUpperCase(),
            cartNumber: cartOrDriver.toUpperCase().includes('CART') ? cartOrDriver.toUpperCase() : `CART-${cartOrDriver}`,
            fullName: formData.fullName.trim() || 'Campus Operator',
            phone: formData.phone.trim() || '+91 98765 43210',
            mode,
          },
        });
      } catch (err) {
        setErrorMsg(err.message || 'Invalid credentials. Please verify your details.');
      } finally {
        setIsSubmitting(false);
      }
    }
  };

  return (
    <div
      style={{
        minHeight: '100vh',
        width: '100%',
        backgroundColor: '#13161B',
        backgroundImage: 'radial-gradient(circle at 50% 35%, #242A34 0%, #13161B 75%)',
        display: 'flex',
        flexDirection: 'column',
        alignItems: 'center',
        justifyContent: 'center',
        padding: '40px 16px',
        fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
        color: '#F4F5F7',
        boxSizing: 'border-box',
      }}
    >
      <style>{`
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
          -webkit-text-fill-color: #F4F5F7 !important;
          -webkit-box-shadow: 0 0 0px 1000px #13161B inset !important;
          transition: background-color 5000s ease-in-out 0s !important;
        }
        .qartix-auth-input {
          background-color: #13161B !important;
          color: #F4F5F7 !important;
          border: 1px solid rgba(255, 255, 255, 0.15) !important;
          transition: border-color 0.15s ease, box-shadow 0.15s ease !important;
        }
        .qartix-auth-input:focus {
          border-color: #10B981 !important;
          box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25) !important;
          outline: none !important;
        }
      `}</style>

      {/* Centered Minimal Qartix Logo + Wordmark Directly Above Card */}
      <div
        style={{
          display: 'flex',
          flexDirection: 'column',
          alignItems: 'center',
          justifyContent: 'center',
          gap: '12px',
          marginBottom: '24px',
          textAlign: 'center',
        }}
      >
        <div
          style={{
            width: '48px',
            height: '48px',
            borderRadius: '12px',
            background: '#1C2128',
            border: '1px solid rgba(255, 255, 255, 0.15)',
            boxShadow: '0 4px 14px rgba(0, 0, 0, 0.4), 2px 2px 0px #0D1013',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
          }}
        >
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#10B981" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="12" cy="12" r="8" />
            <path d="m15.5 15.5 3.5 3.5" />
            <path d="M9 12h6" />
          </svg>
        </div>
        <div>
          <div style={{ fontSize: '24px', fontWeight: 900, letterSpacing: '0.14em', lineHeight: 1.1, color: '#F4F5F7' }}>
            QARTIX
          </div>
          <div style={{ fontSize: '10px', fontWeight: 700, letterSpacing: '0.22em', color: '#9CA3AF', textTransform: 'uppercase', marginTop: '4px' }}>
            CAMPUS EV TRANSIT
          </div>
        </div>
      </div>

      {/* Centered Clean Login / Sign Up Card */}
      <div
        style={{
          width: '100%',
          maxWidth: '460px',
          margin: '0 auto',
          background: '#1C2128',
          border: '1px solid rgba(255, 255, 255, 0.12)',
          boxShadow: '0 16px 36px rgba(0, 0, 0, 0.5), 4px 4px 0px #0D1013',
          borderRadius: '14px',
          padding: '32px 28px',
          display: 'flex',
          flexDirection: 'column',
          gap: '22px',
          boxSizing: 'border-box',
        }}
      >
        {/* 1. Role Selector Tabs */}
        <div
          style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            gap: '4px',
            padding: '4px',
            background: '#13161B',
            border: '1px solid rgba(255, 255, 255, 0.12)',
            borderRadius: '8px',
          }}
        >
          <button
            type="button"
            onClick={() => handleRoleChange('student')}
            style={{
              padding: '9px 8px',
              borderRadius: '6px',
              border: 'none',
              background: role === 'student' ? '#1C2128' : 'transparent',
              color: role === 'student' ? '#F4F5F7' : '#9CA3AF',
              boxShadow: role === 'student' ? '0 1px 4px rgba(0,0,0,0.3)' : 'none',
              fontSize: '11px',
              fontWeight: 700,
              letterSpacing: '0.02em',
              cursor: 'pointer',
              transition: 'all 0.15s ease',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: '5px',
            }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>
            <span>Login as Student</span>
          </button>

          <button
            type="button"
            onClick={() => handleRoleChange('driver')}
            style={{
              padding: '9px 8px',
              borderRadius: '6px',
              border: 'none',
              background: role === 'driver' ? '#1C2128' : 'transparent',
              color: role === 'driver' ? '#F4F5F7' : '#9CA3AF',
              boxShadow: role === 'driver' ? '0 1px 4px rgba(0,0,0,0.3)' : 'none',
              fontSize: '11px',
              fontWeight: 700,
              letterSpacing: '0.02em',
              cursor: 'pointer',
              transition: 'all 0.15s ease',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: '5px',
            }}
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <rect width="18" height="12" x="3" y="6" rx="2" />
              <path d="m9 18 2 3h2l2-3" />
              <circle cx="8" cy="12" r="1.5" />
              <circle cx="16" cy="12" r="1.5" />
            </svg>
            <span>Login as Driver</span>
          </button>
        </div>

        {/* 2. Mode Toggle (Log In vs Sign Up) */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid rgba(255, 255, 255, 0.1)', paddingBottom: '14px' }}>
          <div>
            <h2 style={{ fontSize: '18px', fontWeight: 800, margin: 0, color: '#F4F5F7' }}>
              {mode === 'login' ? 'Account Authentication' : 'Create Campus Access'}
            </h2>
            <div style={{ fontSize: '12px', color: '#9CA3AF', marginTop: '2px' }}>
              {role === 'student' ? 'Student Interface Access' : 'Fleet Operations Console'}
            </div>
          </div>

          <div style={{ display: 'flex', gap: '6px' }}>
            <button
              type="button"
              onClick={() => handleModeChange('login')}
              style={{
                padding: '5px 10px',
                borderRadius: '6px',
                fontSize: '11px',
                fontWeight: 700,
                border: mode === 'login' ? '1px solid rgba(255, 255, 255, 0.2)' : '1px solid transparent',
                background: mode === 'login' ? '#13161B' : 'transparent',
                color: mode === 'login' ? '#F4F5F7' : '#9CA3AF',
                cursor: 'pointer',
              }}
            >
              Log In
            </button>
            <button
              type="button"
              onClick={() => handleModeChange('signup')}
              style={{
                padding: '5px 10px',
                borderRadius: '6px',
                fontSize: '11px',
                fontWeight: 700,
                border: mode === 'signup' ? '1px solid rgba(255, 255, 255, 0.2)' : '1px solid transparent',
                background: mode === 'signup' ? '#13161B' : 'transparent',
                color: mode === 'signup' ? '#F4F5F7' : '#9CA3AF',
                cursor: 'pointer',
              }}
            >
              Sign Up
            </button>
          </div>
        </div>

        {/* Error Message Alert */}
        {errorMsg && (
          <div
            style={{
              padding: '10px 14px',
              background: '#fef2f2',
              border: '1px solid #ef4444',
              borderRadius: '8px',
              color: '#b91c1c',
              fontSize: '12px',
              fontWeight: 600,
              display: 'flex',
              alignItems: 'center',
              gap: '8px',
            }}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="8" x2="12" y2="12" />
              <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <span>{errorMsg}</span>
          </div>
        )}

        {/* 3. Dynamic Form Fields */}
        <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
          {/* STUDENT FIELDS */}
          {role === 'student' && (
            <>
              {mode === 'signup' && (
                <div>
                  <label style={{ display: 'block', fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '6px', color: '#9CA3AF' }}>
                    Full Name
                  </label>
                  <input
                    type="text"
                    name="fullName"
                    value={formData.fullName}
                    onChange={handleChange}
                    placeholder="e.g. Pranav Kumar"
                    className="qartix-auth-input"
                    style={{
                      width: '100%',
                      padding: '11px 14px',
                      borderRadius: '8px',
                      border: '1px solid rgba(255, 255, 255, 0.15)',
                      fontSize: '13px',
                      background: '#13161B',
                      color: '#F4F5F7',
                      boxSizing: 'border-box',
                      outline: 'none',
                    }}
                  />
                </div>
              )}

              <div>
                <label style={{ display: 'block', fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '6px', color: '#9CA3AF' }}>
                  University Roll No. / Email
                </label>
                <input
                  type="text"
                  name="identifier"
                  value={formData.identifier}
                  onChange={handleChange}
                  placeholder="e.g. 2024CS0842 or STU-84920"
                  className="qartix-auth-input"
                  style={{
                    width: '100%',
                    padding: '11px 14px',
                    borderRadius: '8px',
                    border: '1px solid rgba(255, 255, 255, 0.15)',
                    fontSize: '13px',
                    background: '#13161B',
                    color: '#F4F5F7',
                    boxSizing: 'border-box',
                    outline: 'none',
                  }}
                />
              </div>

              {mode === 'signup' && (
                <>
                  {/* Residency Status Radio Group */}
                  <div>
                    <label style={{ display: 'block', fontSize: '11px', fontWeight: 700, letterSpacing: '0.04em', textTransform: 'uppercase', marginBottom: '8px', color: '#9CA3AF' }}>
                      Residency Status
                    </label>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                      {['Hostler', 'Day Scholar'].map((status) => {
                        const isSelected = formData.residencyStatus === status;
                        return (
                          <label
                            key={status}
                            style={{
                              display: 'flex',
                              alignItems: 'center',
                              gap: '10px',
                              padding: '10px 14px',
                              background: isSelected ? 'rgba(16, 185, 129, 0.12)' : '#13161B',
                              border: isSelected ? '1.5px solid #10B981' : '1px solid rgba(255, 255, 255, 0.15)',
                              borderRadius: '8px',
                              cursor: 'pointer',
                              transition: 'all 0.15s ease',
                              boxShadow: isSelected ? '0 0 12px rgba(16, 185, 129, 0.2)' : 'none',
                            }}
                          >
                            <input
                              type="radio"
                              name="residencyStatus"
                              value={status}
                              checked={isSelected}
                              onChange={handleChange}
                              style={{
                                accentColor: '#10B981',
                                cursor: 'pointer',
                                width: '15px',
                                height: '15px',
                              }}
                            />
                            <span style={{ fontSize: '13px', fontWeight: isSelected ? 700 : 500, color: isSelected ? '#F4F5F7' : '#9CA3AF' }}>
                              {status}
                            </span>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  {/* Mobile Number Field */}

    /**
     * DriverInterface Component
     * Modern EV Cockpit Dashboard (Uber Driver / Tesla EV Aesthetic)
     * Glare-free, high-contrast, driver-first ergonomics.
     */
    function DriverInterface({
      driver = { cartNumber: 'CART-04', fullName: 'Vikram Singh', id: 'DRV-402' },
      onLogout = () => { },
    }) {
      // Navigation & Fleet Status
      const [activeTab, setActiveTab] = useState('active'); // 'active' | 'queue'
      const [isOnline, setIsOnline] = useState(true);

      // Responsive Screen Width Detection (>= 1024px is desktop/laptop 2-column layout)
      const [isDesktop, setIsDesktop] = useState(
        typeof window !== 'undefined' ? window.innerWidth >= 1024 : true
      );

      useEffect(() => {
        const handleResize = () => {
          setIsDesktop(window.innerWidth >= 1024);
        };
        window.addEventListener('resize', handleResize);
        handleResize();
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      // Queue State
      const [queue, setQueue] = useState(INITIAL_QUEUE);
      const [activeRideIndex, setActiveRideIndex] = useState(0);

      // 3-State Sequential Ride Action:
      // 1: 'I HAVE ARRIVED' (#38BDF8 Sky Blue)
      // 2: 'STUDENT ON BOARD — START RIDE' (#10B981 Electric Emerald)
      // 3: 'COMPLETE RIDE' (#34D399 Bright Emerald)
      const [rideStep, setRideStep] = useState(1);

      // Card slide animation state: 'idle' | 'exiting' | 'entering'
      const [cardAnimation, setCardAnimation] = useState('idle');

      // Phone Call Simulation Toast
      const [callToast, setCallToast] = useState(null);

      // Auto-dismiss phone call toast after 5 seconds
      useEffect(() => {
        if (!callToast) return;
        const timer = setTimeout(() => {
          setCallToast(null);
        }, 5000);
        return () => clearTimeout(timer);
      }, [callToast]);

      // Current Ride
      const currentRide = queue[activeRideIndex] || null;
      const isQueueFinished = !currentRide || activeRideIndex >= queue.length;
      const waitingRidesCount = queue.filter((q) => q.status === 'Waiting').length;

      // Handle Cycling Through the 3 Ride States
      const handleSequentialAction = () => {
        if (!isOnline || isQueueFinished) return;

        if (rideStep === 1) {
          // 'I HAVE ARRIVED' -> 'STUDENT ON BOARD — START RIDE'
          setRideStep(2);
        } else if (rideStep === 2) {
          // 'STUDENT ON BOARD — START RIDE' -> 'COMPLETE RIDE'
          setRideStep(3);
        } else if (rideStep === 3) {
          // 'COMPLETE RIDE' -> Mark finished & advance
          setCardAnimation('exiting');

          setTimeout(() => {
            setQueue((prevQueue) =>
              prevQueue.map((item, idx) =>
                idx === activeRideIndex ? { ...item, status: 'Completed' } : item
              )
            );

            let nextIndex = activeRideIndex + 1;
            while (nextIndex < queue.length && queue[nextIndex].status === 'Skipped by Student') {
              nextIndex++;
            }

            setActiveRideIndex(nextIndex);
            setRideStep(1);
            setCardAnimation('entering');

            setTimeout(() => {
              setCardAnimation('idle');
            }, 50);
          }, 300);
        }
      };

      // Trigger Phone Call Toast
      const handleCallStudent = (student) => {
        setCallToast({
          name: student.studentName,
          phone: student.phone,
          id: student.studentId,
        });
      };

      // Reset Demo Queue
      const handleResetQueue = () => {
        setQueue(INITIAL_QUEUE);
        setActiveRideIndex(0);
        setRideStep(1);
        setCardAnimation('idle');
      };

      // Format Cart Display Name (e.g. "CART-04")
      const cartLabel = (driver.cartNumber || 'CART-04').toUpperCase();

      // Shared Action Button Renderer (Inline on Desktop, Sticky on Mobile)

        let buttonBg = '#10B981';
        let buttonTextColor = '#052E16';
        let buttonLabel = 'I HAVE ARRIVED';
        let glowShadow = '0 8px 24px rgba(56, 189, 248, 0.35)';

        if (!isOnline) {
          buttonBg = '#1E293B';
          buttonTextColor = '#94A3B8';
          buttonLabel = 'GO ONLINE TO PROCEED';
          glowShadow = 'none';
        } else if (isQueueFinished) {
          buttonBg = '#1E293B';
          buttonTextColor = '#94A3B8';
          buttonLabel = 'ALL RIDES COMPLETED';
          glowShadow = 'none';
        } else if (rideStep === 1) {
          buttonBg = '#38BDF8'; // Sky Blue
          buttonTextColor = '#082F49';
          buttonLabel = 'I HAVE ARRIVED';
          glowShadow = '0 8px 24px rgba(56, 189, 248, 0.35)';

          buttonTextColor = '#052E16';
          buttonLabel = 'STUDENT ON BOARD — START RIDE';
          glowShadow = '0 8px 24px rgba(16, 185, 129, 0.35)';

          buttonLabel = 'COMPLETE RIDE';
          glowShadow = '0 8px 24px rgba(52, 211, 153, 0.4)';

        return (
          <button
            type="button"
            disabled={!isOnline || isQueueFinished}
            onClick={handleSequentialAction}
            style={{
              width: '100%',
              height: '64px',

              transition: 'all 0.2s cubic-bezier(0.16, 1, 0.3, 1)',

            }}

            {rideStep === 2 && isOnline && !isQueueFinished && (

                <polygon points="5 3 19 12 5 21 5 3" />
              </svg>

            {rideStep === 3 && isOnline && !isQueueFinished && (

                <polyline points="20 6 9 17 4 12" />
              </svg>

            <span>{buttonLabel}</span>
          </button>

              const isActive = index === activeRideIndex && item.status === 'Waiting';

        // Floor Pedals

        [-0.35, -0.15, 0.05, 0.25].forEach((tx) => {

        // Vertical black rear U-shaped grab bar

        // =========================================================

        const batteryTray = new THREE.Mesh(new THREE.BoxGeometry(0.96, 0.14, 1.85), batteryTrayMat);

        [
          [-0.23, 0.14, -0.65],
          [0.23, 0.14, -0.65],
          [-0.23, 0.14, -0.22],
          [0.23, 0.14, -0.22],
          [-0.23, 0.14, 0.22],

        ].forEach(([cx, cy, cz]) => {
          const cell = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.09, 0.36), batteryCellMat);
          cell.position.set(cx, cy, cz);

        const busbar = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 1.7), busbarMat);
        busbar.position.set(0, 0.17, 0);
        batteryGroup.add(busbar);

        // =========================================================
        // 7. MOTOR GROUP (Rear Electric Transaxle Drive & Cables)
        // =========================================================
        const rearMotor = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.46, 24), motorHousingMat);
        rearMotor.rotateZ(Math.PI / 2);
        rearMotor.position.set(0, 0.26, -1.075);
        motorGroup.add(rearMotor);

        [-0.15, -0.05, 0.05, 0.15].forEach((xOff) => {
          const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.02, 24), suspensionAlloyMat);
          rib.rotateZ(Math.PI / 2);

        const inverter = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.14, 0.28), motorHousingMat);
        inverter.position.set(0, 0.42, -1.075);
        const frontSteeringMotor = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.36, 20), motorHousingMat);
        frontSteeringMotor.rotateZ(Math.PI / 2);
        frontSteeringMotor.position.set(0, 0.26, 1.075);
        motorGroup.add(inverter, frontSteeringMotor);

        const createHvCable = (pts) => {
          const curve = new THREE.CatmullRomCurve3(pts);

          return new THREE.Mesh(tubeGeo, orangeHvCableMat);
        };

        motorGroup.add(
          createHvCable([
            new THREE.Vector3(-0.1, 0.16, -0.85),
            new THREE.Vector3(-0.15, 0.28, -0.98),
            new THREE.Vector3(-0.1, 0.38, -1.05),
          ]),
          createHvCable([
            new THREE.Vector3(0.1, 0.16, -0.85),
            new THREE.Vector3(0.15, 0.28, -0.98),
            new THREE.Vector3(0.1, 0.38, -1.05),
          ]),
          createHvCable([
            new THREE.Vector3(0, 0.16, 0.85),
            new THREE.Vector3(0, 0.22, 0.96),
            new THREE.Vector3(0, 0.26, 1.02),
          ])
        );

        // =========================================================
        // 8. SUSPENSION GROUP (Chunky Rubber Tires & 5-Spoke Alloys)
        // =========================================================
        [
          { id: 'FL', x: -0.58, y: 0.26, z: 1.075, side: 'left' },
          { id: 'FR', x: 0.58, y: 0.26, z: 1.075, side: 'right' },
          { id: 'RL', x: -0.58, y: 0.26, z: -1.075, side: 'left' },
          { id: 'RR', x: 0.58, y: 0.26, z: -1.075, side: 'right' },
        ].forEach(({ id, x, y, z, side }) => {
          const cornerSub = new THREE.Group();
          cornerSub.name = `corner_${id}`;
          cornerSub.position.set(x, y, z);
          cornerSub.userData = { defaultX: x, side };

          // Chunky rounded turf rubber tire
          const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.22, 32), tireRubberMat);
          tire.rotateZ(Math.PI / 2);
          cornerSub.add(tire);

          // Rounded outer tire shoulders (gives chunky rounded golf cart tire profile)
          const outerShoulder = new THREE.Mesh(new THREE.TorusGeometry(0.23, 0.032, 12, 28), tireRubberMat);
          outerShoulder.position.set(side === 'left' ? -0.1 : 0.1, 0, 0);
          outerShoulder.rotateY(Math.PI / 2);
          const innerShoulder = new THREE.Mesh(new THREE.TorusGeometry(0.23, 0.032, 12, 28), tireRubberMat);
          innerShoulder.position.set(side === 'left' ? 0.1 : -0.1, 0, 0);
          innerShoulder.rotateY(Math.PI / 2);
          cornerSub.add(outerShoulder, innerShoulder);

          // Realistic deep-dish silver 5-spoke alloy rim
          const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.185, 0.225, 24), wheelAlloyMat);
          rim.rotateZ(Math.PI / 2);
          cornerSub.add(rim);

          // 5 Sculpted silver alloy spokes
          for (let i = 0; i < 5; i++) {
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.145, 0.024), wheelAlloyMat);
            spoke.rotateZ((i * Math.PI * 2) / 5);
            spoke.position.set(side === 'left' ? -0.105 : 0.105, 0, 0);
            cornerSub.add(spoke);
          }

          // Chrome central hub cap
          const hubCap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.02, 16), wheelAlloyMat);
          hubCap.rotateZ(Math.PI / 2);
          hubCap.position.set(side === 'left' ? -0.112 : 0.112, 0, 0);
          cornerSub.add(hubCap);

          // Brake rotor disc
          const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.015, 20), suspensionAlloyMat);
          rotor.rotateZ(Math.PI / 2);
          rotor.position.set(side === 'left' ? 0.06 : -0.06, 0, 0);
          cornerSub.add(rotor);

          // Brake caliper
          const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.075, 0.065), brakeCaliperMat);
          caliper.position.set(side === 'left' ? 0.06 : -0.06, 0.08, 0.05);
          cornerSub.add(caliper);

          // Strut coil spring
          const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.32, 12), coilSpringMat);
          strut.position.set(side === 'left' ? 0.15 : -0.15, 0.12, 0);
          strut.rotation.z = side === 'left' ? -0.2 : 0.2;
          cornerSub.add(strut);

          // Lower control arm
          const arm = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.03, 0.04), suspensionAlloyMat);
          arm.position.set(side === 'left' ? 0.12 : -0.12, 0, 0);
          cornerSub.add(arm);

          suspensionGroup.add(cornerSub);
          suspCorners.push(cornerSub);
        });

        // Assemble All 7 Groups into Master
        master.add(chassisGroup);
        master.add(bodyPanelsGroup);
        master.add(canopyGroup);
        master.add(seatingGroup);
        master.add(batteryGroup);
        master.add(motorGroup);
        master.add(suspensionGroup);

        // Soft circular shadow-catching floor plane beneath the cart in studio lighting
        const shadowGeo = new THREE.PlaneGeometry(5.4, 3.8);
        const shadowCanvas = document.createElement('canvas');
        shadowCanvas.width = 256;
        shadowCanvas.height = 256;
        const ctx = shadowCanvas.getContext('2d');
        const grad = ctx.createRadialGradient(128, 128, 15, 128, 128, 124);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.90)');
        grad.addColorStop(0.35, 'rgba(0, 0, 0, 0.65)');
        grad.addColorStop(0.70, 'rgba(10, 14, 18, 0.25)');
        grad.addColorStop(1, 'rgba(19, 22, 27, 0.0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 256, 256);

        const shadowTex = new THREE.CanvasTexture(shadowCanvas);
        const shadowMat = new THREE.MeshBasicMaterial({
          map: shadowTex,
          transparent: true,
          opacity: 0.92,
          depthWrite: false,
        });
        const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
        shadowMesh.rotation.x = -Math.PI / 2;
        shadowMesh.position.set(0, 0.003, 0);
        master.add(shadowMesh);

        // Store References
        groupsRef.current = {
          chassisGroup,
          bodyPanelsGroup,
          canopyGroup,
          seatingGroup,
          batteryGroup,
          motorGroup,
          suspensionGroup,
        };
        suspensionCornersRef.current = suspCorners;
        mainPaintMaterialsRef.current = mainPaintMats;
        bodyMaterialsRef.current = bodyMats;
        canopyMaterialsRef.current = canopyMats;
        batteryMaterialsRef.current = batteryMats;
        motorMaterialsRef.current = motorMats;
        suspensionMaterialsRef.current = suspMats;

        return master;
      }, []);

      // -------------------------------------------------------------
      // THREE.JS INITIALIZATION & LIFETIME RENDER LOOP (SINGLE MOUNT)
      // -------------------------------------------------------------
      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        // Scene with Architectural Slate Studio Ambience
        const scene = new THREE.Scene();
        scene.background = null; // Let the CSS radial spotlight shine through
        scene.fog = new THREE.FogExp2(0x13161B, 0.035);
        sceneRef.current = scene;

        // Camera
        const camera = new THREE.PerspectiveCamera(
          42,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        camera.position.set(3.8, 1.8, 4.4);
        cameraRef.current = camera;

        // Renderer (Alpha enabled for studio spotlight)
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          powerPreference: 'high-performance',
        });
        renderer.setClearColor(0x13161b, 0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        rendererRef.current = renderer;
        container.appendChild(renderer.domElement);

        // Architectural Studio Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x13161b, 0.95);
        scene.add(hemiLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
        keyLight.position.set(5.5, 8.0, 5.0);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x718096, 1.2);
        fillLight.position.set(-6.0, 4.5, -4.0);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xb0d5f8, 2.4);
        rimLight.position.set(0, 6.0, -6.5);
        scene.add(rimLight);

        // Cart Master Group
        const cart = buildProceduralCart();
        cartMasterGroupRef.current = cart;
        scene.add(cart);

        // Window Resize Handler
        const handleResize = () => {
          if (!cameraRef.current || !rendererRef.current) return;
          const w = window.innerWidth;
          const h = window.innerHeight;
          cameraRef.current.aspect = w / h;
          cameraRef.current.updateProjectionMatrix();
          rendererRef.current.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        // Drag-to-Orbit Listeners
        const onPointerDown = (e) => {
          if (e.target.closest('button') || e.target.closest('header')) return;
          isDraggingRef.current = true;
          pointerStartRef.current = { x: e.clientX, y: e.clientY };
        };

        const onPointerMove = (e) => {
          if (!isDraggingRef.current) return;
          const deltaX = (e.clientX - pointerStartRef.current.x) * 0.005;
          const deltaY = (e.clientY - pointerStartRef.current.y) * 0.005;
          pointerStartRef.current = { x: e.clientX, y: e.clientY };

          targetOrbitOffsetRef.current.yaw += deltaX;
          targetOrbitOffsetRef.current.pitch = THREE.MathUtils.clamp(
            targetOrbitOffsetRef.current.pitch + deltaY,
            -0.45,
            0.45
          );
        };

        const onPointerUp = () => {
          isDraggingRef.current = false;
        };

        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);

        // Animation & Render Loop
        let animationFrameId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const elapsedTime = clock.getElapsedTime();

          // Smooth Orbit Drag Damping
          orbitOffsetRef.current.yaw = THREE.MathUtils.lerp(
            orbitOffsetRef.current.yaw,
            targetOrbitOffsetRef.current.yaw,
            0.08
          );
          orbitOffsetRef.current.pitch = THREE.MathUtils.lerp(
            orbitOffsetRef.current.pitch,
            targetOrbitOffsetRef.current.pitch,
            0.08
          );

          // Read Dynamic Inputs from Refs (Zero React Re-mounts)
          const p = scrollProgressRef.current;
          const groups = groupsRef.current;
          const cartMaster = cartMasterGroupRef.current;
          const sub = activeSubsystemRef.current;
          const expOverride = explosionOverrideRef.current;

          const targetCamPos = new THREE.Vector3();
          const targetLook = new THREE.Vector3(0, 0.6, 0);

          // =========================================================
          // STAGE 01: [0.00, 0.25) - Hero Front-3/4 Angle
          // =========================================================
          if (p < 0.25) {
            const t = p / 0.25;
            targetCamPos.set(
              THREE.MathUtils.lerp(3.8, 3.2, t),
              THREE.MathUtils.lerp(1.7, 1.4, t),
              THREE.MathUtils.lerp(4.4, 3.8, t)
            );
            targetLook.set(
              THREE.MathUtils.lerp(-0.5, 0.3, t),
              THREE.MathUtils.lerp(0.55, 0.45, t),
              THREE.MathUtils.lerp(0.0, 0.95, t)
            );

            // Subtle Idle Hover Breathing
            if (cartMaster) {
              const hoverY = Math.sin(elapsedTime * 1.8) * 0.035 * (1 - t * 0.8);
              const hoverRoll = Math.cos(elapsedTime * 1.3) * 0.008 * (1 - t * 0.8);
              cartMaster.position.y = hoverY;
              cartMaster.rotation.z = hoverRoll;
            }

            // Restore Solid Body Materials
            bodyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
              if (m.opacity !== 1.0) {
                m.transparent = false;
                m.opacity = 1.0;
              }
            });
            canopyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
            });
          }
          // =========================================================
          // STAGE 02: [0.25, 0.50) - 3-Beat Orbit
          // =========================================================
          else if (p < 0.5) {
            const t = (p - 0.25) / 0.25;

            if (cartMaster) {
              cartMaster.position.y = 0;
              cartMaster.rotation.z = 0;
            }

            // Beat 1: tight front-3/4 headlights (t: 0.0 -> 0.35)
            // Beat 2: strict 90° side profile (t: 0.35 -> 0.70)
            // Beat 3: sweeping rear-3/4 taillight (t: 0.70 -> 1.0)
            if (t < 0.35) {
              const subT = t / 0.35;
              targetCamPos.set(
                THREE.MathUtils.lerp(3.2, 1.75, subT),
                THREE.MathUtils.lerp(1.4, 0.75, subT),
                THREE.MathUtils.lerp(3.8, 2.15, subT)
              );
              targetLook.set(0.3, 0.45, 0.95);
            } else if (t < 0.7) {
              const subT = (t - 0.35) / 0.35;
              targetCamPos.set(
                THREE.MathUtils.lerp(1.75, 4.6, subT),
                THREE.MathUtils.lerp(0.75, 0.85, subT),
                THREE.MathUtils.lerp(2.15, 0.0, subT)
              );
              targetLook.set(0, 0.55, 0);
            } else {
              const subT = (t - 0.7) / 0.3;
              targetCamPos.set(
                THREE.MathUtils.lerp(4.6, -3.2, subT),
                THREE.MathUtils.lerp(0.85, 1.25, subT),
                THREE.MathUtils.lerp(0.0, -3.8, subT)
              );
              targetLook.set(0, 0.55, -0.4);
            }

            bodyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
              if (m.opacity !== 1.0) {
                m.transparent = false;
                m.opacity = 1.0;
              }
            });
            canopyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
            });
          }
          // =========================================================
          // STAGE 03: [0.50, 0.75) - Exploded Assembly
          // =========================================================
          else if (p < 0.75) {
            const t = (p - 0.5) / 0.25;
            targetCamPos.set(
              THREE.MathUtils.lerp(-3.2, 3.6, t),
              THREE.MathUtils.lerp(1.25, 2.9, t),
              THREE.MathUtils.lerp(-3.8, 4.1, t)
            );
            targetLook.set(0, 0.55, 0);

            let explosionTarget = t;
            if (expOverride !== null) {
              explosionTarget = expOverride;
            }

            currentExplosionRef.current = THREE.MathUtils.lerp(
              currentExplosionRef.current,
              explosionTarget,
              0.08
            );

            bodyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
            });
            canopyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== false) m.wireframe = false;
            });
          }
          // =========================================================
          // STAGE 04: [0.75, 1.00] - X-Ray Cutaway
          // =========================================================
          else {
            const t = (p - 0.75) / 0.25;

            if (sub === '01') {
              // Battery Focus
              targetCamPos.set(2.0, 0.45, 1.2);
              targetLook.set(0, 0.2, 0);
            } else if (sub === '02') {
              // Motor Focus
              targetCamPos.set(-1.6, 0.75, -2.1);
              targetLook.set(0, 0.35, -1.05);
            } else if (sub === '03') {
              // Suspension Focus
              targetCamPos.set(1.9, 0.55, 1.6);
              targetLook.set(0.58, 0.3, 1.075);
            } else {
              // Full Cutaway Overview
              targetCamPos.set(
                THREE.MathUtils.lerp(3.6, 3.1, t),
                THREE.MathUtils.lerp(2.9, 1.75, t),
                THREE.MathUtils.lerp(4.1, 3.6, t)
              );
              targetLook.set(0, 0.55, 0);
            }

            // Return explosion to 0 for assembled cutaway
            currentExplosionRef.current = THREE.MathUtils.lerp(
              currentExplosionRef.current,
              0,
              0.08
            );

            // Turn Outer Body Panels & Canopy into Translucent Wireframe
            bodyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== true) m.wireframe = true;
              m.transparent = true;
              m.opacity = 0.22;
            });
            canopyMaterialsRef.current.forEach((m) => {
              if (m.wireframe !== true) m.wireframe = true;
              m.transparent = true;
              m.opacity = 0.18;
            });

            // Dynamic Pulsing Internal Subsystem Glow
            const pulse = 1.0 + Math.sin(elapsedTime * 4.0) * 0.4;
            batteryMaterialsRef.current.forEach((m) => {
              if (m.emissive) m.emissiveIntensity = (sub === '01' ? 4.5 : 1.4) * pulse;
            });
            motorMaterialsRef.current.forEach((m) => {
              if (m.emissive) m.emissiveIntensity = (sub === '02' ? 4.0 : 1.2) * pulse;
            });
            suspensionMaterialsRef.current.forEach((m) => {
              if (m.emissive) m.emissiveIntensity = (sub === '03' ? 3.5 : 0.9) * pulse;
            });
          }

          // Smooth Camera Lerp
          camera.position.lerp(targetCamPos, 0.08);

          // Apply Drag Orbit Offset
          const rotatedPos = camera.position.clone();
          rotatedPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), orbitOffsetRef.current.yaw);
          camera.position.copy(rotatedPos);
          camera.position.y += orbitOffsetRef.current.pitch * 1.5;

          currentCameraLookAtRef.current.lerp(targetLook, 0.08);
          camera.lookAt(currentCameraLookAtRef.current);

          // Explode the 7 Groups outward along their axes
          const ef = currentExplosionRef.current;
          if (groups.canopyGroup) groups.canopyGroup.position.set(0, ef * 1.45, ef * 0.1);
          if (groups.bodyPanelsGroup) groups.bodyPanelsGroup.position.set(ef * 0.2, ef * 0.65, ef * 0.3);
          if (groups.seatingGroup) groups.seatingGroup.position.set(0, ef * 0.52, 0);
          if (groups.chassisGroup) groups.chassisGroup.position.set(0, 0, 0); // Anchor Datum
          if (groups.batteryGroup) groups.batteryGroup.position.set(0, -ef * 0.62, 0);

            const heightHalf = window.innerHeight / 2;

              worldPos.project(camera);

              const x = worldPos.x * widthHalf + widthHalf;
              const y = -(worldPos.y * heightHalf) + heightHalf;
              const isVisible = worldPos.z < 1;
              coords[pin.id] = { x, y, isVisible };
            });

            setPinScreenCoords(coords);
          }

/**
 * Retrieve shared pass requests from localStorage, seeding if empty
 */
function getStoredRequests() {
  if (typeof window === 'undefined') return SEED_REQUESTS;
  try {
    const raw = localStorage.getItem('qartix_pass_requests');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        return parsed;
      }
    }
    localStorage.setItem('qartix_pass_requests', JSON.stringify(SEED_REQUESTS));
    return SEED_REQUESTS;
  } catch (e) {
    return SEED_REQUESTS;
  }
}

/**
 * StudentDashboard Component
 * Features an Interactive Monthly Pass Builder with Medical Verification requirement,
 * live ticket preview, and Today's Live Ride schedule.
 */
function StudentDashboard({
  student = { id: 'STU-84920', fullName: 'Pranav Kumar', hostelBlock: 'Block-C Oak Hall' },
  onReturnTo3D = () => {},
  onLogout = () => {},
}) {
  const currentStudentId = student?.id || 'STU-84920';

  // -----------------------------------------------------------
  // 1. SHARED PASS REQUESTS & SYNC STATE
  // -----------------------------------------------------------
  const [requestsList, setRequestsList] = useState(getStoredRequests);

  // Sync across tabs & storage events
  useEffect(() => {
    const handleStorageChange = () => {
      setRequestsList(getStoredRequests());
    };
    window.addEventListener('storage', handleStorageChange);
    return () => window.removeEventListener('storage', handleStorageChange);
  }, []);

  // Find latest request for the active student
  const currentRequest = requestsList.find(
    (r) => r.studentId.toUpperCase() === currentStudentId.toUpperCase()
  ) || requestsList[0] || null;

  // Pass status: active once submitted / loaded
  const passStatus = currentRequest ? currentRequest.status : 'active';
  const isApproved = true; // Always active upon submission in 2-role system
  const isPending = false;
  const isRejected = false;

  // -----------------------------------------------------------
  // 2. PASS BUILDER & MEDICAL FORM STATE
  // -----------------------------------------------------------
  const [routeType, setRouteType] = useState('hostel_class'); // 'hostel_class' | 'gate_class'
  const [pickup, setPickup] = useState(currentRequest?.pickup || PICKUP_LOCATIONS[0]);
  const [drop, setDrop] = useState(currentRequest?.drop || DROP_LOCATIONS[0]);
  const [selectedSlots, setSelectedSlots] = useState(currentRequest?.timeSlots || ['08:30 AM', '04:30 PM']);
  const [duration, setDuration] = useState('1m');

  // Medical Verification Form Fields
  const [medicalCondition, setMedicalCondition] = useState(
    currentRequest?.medicalCondition || MEDICAL_CONDITIONS[0]
  );
  const [customCondition, setCustomCondition] = useState('');
  const [reason, setReason] = useState(
    currentRequest?.reason || 'Unable to walk from hostel to academic block due to cast on right leg.'
  );
  const [medicalSlip, setMedicalSlip] = useState(
    currentRequest
      ? {
          name: currentRequest.certificateName || 'orthopedic_clinic_referral.pdf',
          size: currentRequest.certificateSize || '412 KB',
          timestamp: currentRequest.submittedTime || 'Today 09:30 AM',
        }
      : {
          name: 'orthopedic_clinic_referral.pdf',
          size: '412 KB',
          timestamp: 'Today 09:30 AM',
        }
  );
  const [certificatePreview, setCertificatePreview] = useState(
    currentRequest?.certificatePreview || null
  );

  const [isDraggingFile, setIsDraggingFile] = useState(false);
  const [formError, setFormError] = useState('');
  const [submitSuccessMsg, setSubmitSuccessMsg] = useState('');
  const [rollKey, setRollKey] = useState(0); // Trigger vertical roll transition
  const fileInputRef = useRef(null);

  // Trigger vertical roll animation on input change
  const triggerRoll = () => {
    setRollKey((prev) => prev + 1);
  };

  const handleRouteTypeToggle = (type) => {
    setRouteType(type);
    if (type === 'hostel_class') {
      setPickup(PICKUP_LOCATIONS[0]);
      setDrop(DROP_LOCATIONS[0]);
    } else {
      setPickup('Main Campus Gate (North)');
      setDrop('Central Academic Quad');
    }
    triggerRoll();
  };

  const toggleSlot = (slot) => {
    setSelectedSlots((prev) => {
      const exists = prev.includes(slot);
      const next = exists ? prev.filter((s) => s !== slot) : [...prev, slot];
      return next.length > 0 ? next : [slot];
    });
    triggerRoll();
  };

  const handleDurationSelect = (durId) => {
    setDuration(durId);
    triggerRoll();
  };

  const handleFileUpload = (file) => {
    if (!file) return;

    // Check if image for preview
    if (file.type && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        setCertificatePreview(e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      setCertificatePreview(null);
    }

    setMedicalSlip({
      name: file.name,
      size: `${(file.size / 1024).toFixed(1)} KB`,
      timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    });
    if (formError) setFormError('');
    triggerRoll();
  };

  const durationObj = DURATIONS.find((d) => d.id === duration) || DURATIONS[1];

  // Submit for Verification
  const handleSubmitVerification = (e) => {
    if (e && e.preventDefault) e.preventDefault();

    if (!medicalCondition) {
      setFormError('Please select your medical condition or injury type.');
      return;
    }
    if (!reason.trim()) {
      setFormError('Please specify the reason for your monthly mobility pass.');
      return;
    }
    if (!medicalSlip) {
      setFormError('Please upload a valid medical certificate or clinic slip (.pdf, .jpg, .png).');
      return;
    }

    const finalCondition =
      medicalCondition === 'Other' && customCondition.trim() ? customCondition.trim() : medicalCondition;

    const newApplication = {
      id: `REQ-${Date.now().toString().slice(-4)}`,
      studentName: student.fullName || 'Student User',
      studentId: currentStudentId,
      residencyType: student.residencyStatus || student.hostelBlock || 'Hostler',
      mobile: student.phone || '+91 98765 43210',
      route: `${pickup} → ${drop}`,
      pickup,
      drop,
      timeSlots: selectedSlots,
      duration: durationObj.label,
      medicalCondition: finalCondition,
      reason: reason.trim(),
      certificateName: medicalSlip.name,
      certificatePreview: certificatePreview || null,
      certificateSize: medicalSlip.size,
      status: 'active',
      submittedAt: new Date().toISOString(),
      submittedTime: 'Today ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
    };

    try {
      const existing = getStoredRequests();
      const updated = [
        newApplication,
        ...existing.filter((r) => r.studentId.toUpperCase() !== currentStudentId.toUpperCase()),
      ];
      localStorage.setItem('qartix_pass_requests', JSON.stringify(updated));
      setRequestsList(updated);
    } catch (err) {
      console.error('Failed to save pass request to localStorage', err);
    }

    setFormError('');
    setSubmitSuccessMsg(`Pass submitted & active! Transport office notified. Request ID: ${newApplication.id}.`);
    triggerRoll();
    setTimeout(() => setSubmitSuccessMsg(''), 7000);
  };

  // -----------------------------------------------------------
  // 3. TODAY'S SCHEDULE & RIDES STATE
  // -----------------------------------------------------------
  const [rides, setRides] = useState([
    {
      id: 'ride-1',

                  border: '1px solid rgba(255, 255, 255, 0.12)',
                  borderRadius: '8px',
                  fontSize: '12px',
                  fontWeight: 700,
                  cursor: 'pointer',
                }}
              >
                Cancel
              </button>

              <button
                type="button"
                onClick={handleRequestExtraRide}
                disabled={extraConfirmed}
                style={{
                  padding: '10px 20px',
                  background: extraConfirmed ? '#2E6F5E' : '#10B981',
                  color: extraConfirmed ? '#FFFFFF' : '#0B1116',
                  border: extraConfirmed ? '1px solid #2E6F5E' : '1px solid #10B981',
                  boxShadow: '0 4px 14px rgba(16, 185, 129, 0.25), 3px 3px 0px #0D1013',
                  borderRadius: '8px',
                  fontSize: '12px',
                  fontWeight: 900,
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  gap: '6px',
                  transition: 'all 0.15s ease',
                }}
                onMouseEnter={(e) => {
                  if (!extraConfirmed) {
                    e.currentTarget.style.background = '#34D399';
                  }
                }}
                onMouseLeave={(e) => {
                  if (!extraConfirmed) {
                    e.currentTarget.style.background = '#10B981';
                  }
                }}
              >
                {extraConfirmed ? 'Dispatched!' : 'Dispatch Nearest Cart →'}
              </button>
            </div>
          </div>
        </div>
      ) : null}
    </div>
  );
}

    // =========================================================
    // 3.5. ADMIN INTERFACE (TRANSPORT OFFICE)

function AdminInterface({ admin = { fullName: 'Transport Officer' }, onLogout = () => {} }) {
  const [activeTab, setActiveTab] = useState('passes'); // 'passes' | 'drivers' | 'fleet'
  const [passRequests, setPassRequests] = useState([]);
  const [drivers, setDrivers] = useState([]);
  const [carts, setCarts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [actionMsg, setActionMsg] = useState('');
  const [selectedDoc, setSelectedDoc] = useState(null);

  const loadData = async () => {
    setLoading(true);
    try {
      if (supabase) {
        const { data: passes } = await supabase.from('pass_requests').select('*').order('created_at', { ascending: false });
        if (passes) setPassRequests(passes);

        const { data: drvs } = await supabase.from('profiles').select('*').eq('role', 'driver').order('created_at', { ascending: false });
        if (drvs) setDrivers(drvs);

        const { data: crts } = await supabase.from('carts').select('*').order('cart_number');
        if (crts) setCarts(crts);
      }
    } catch (e) {
      console.error('Error loading admin data:', e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    loadData();
  }, []);

  const showNotification = (msg) => {
    setActionMsg(msg);
    setTimeout(() => setActionMsg(''), 4000);
  };

  const handleReviewPass = async (requestId, newStatus) => {
    try {
      if (supabase) {
        const { error } = await supabase.from('pass_requests').update({
          status: newStatus,
          reviewed_at: new Date().toISOString(),
          admin_notes: newStatus === 'approved' ? 'Approved by Transport Office' : 'Rejected - please provide updated documentation.',
        }).eq('id', requestId);
        if (error) throw error;
      }
      setPassRequests((prev) => prev.map((p) => (p.id === requestId ? { ...p, status: newStatus } : p)));
      showNotification(`Pass ${requestId} has been marked as ${newStatus.toUpperCase()}.`);
    } catch (err) {
      alert('Failed to update pass request: ' + err.message);
    }
  };

  const handleToggleDriverApproval = async (driverProfileId, currentStatus) => {
    try {
      const nextStatus = !currentStatus;
      if (supabase) {
        const { error } = await supabase.from('profiles').update({ driver_approved: nextStatus }).eq('id', driverProfileId);
        if (error) throw error;
      }
      setDrivers((prev) => prev.map((d) => (d.id === driverProfileId ? { ...d, driver_approved: nextStatus } : d)));
      showNotification(`Driver status updated to ${nextStatus ? 'APPROVED' : 'PENDING'}.`);
    } catch (err) {
      alert('Failed to update driver: ' + err.message);
    }
  };

  const handleAssignCart = async (cartNumber, driverId) => {
    try {
      const assignedVal = driverId === '' ? null : driverId;
      if (supabase) {
        const { error } = await supabase.from('carts').update({ assigned_driver_id: assignedVal }).eq('cart_number', cartNumber);
        if (error) throw error;
      }
      setCarts((prev) => prev.map((c) => (c.cart_number === cartNumber ? { ...c, assigned_driver_id: assignedVal } : c)));
      showNotification(`Cart ${cartNumber} assignment updated.`);
    } catch (err) {
      alert('Failed to assign cart: ' + err.message);
    }
  };

  return (
    <div
      style={{
        minHeight: '100vh',
        backgroundColor: '#13161B',
        backgroundImage: 'radial-gradient(circle at 60% 30%, #242A34 0%, #13161B 80%)',
        color: '#F4F5F7',
        fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
        paddingBottom: '60px',
      }}
    >
      {actionMsg && (
        <div
          style={{
            position: 'fixed',
            top: '80px',
            right: '24px',
            zIndex: 9999,

            color: '#10B981',
            border: '1px solid #10B981',
            borderRadius: '8px',

            boxShadow: '0 8px 24px rgba(0,0,0,0.5)',

      <header

          zIndex: 50,

          alignItems: 'center',
          justifyContent: 'space-between',

          borderBottom: '1px solid rgba(255, 255, 255, 0.12)',
        }}
      >
        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
          <div
            style={{

              border: '1px solid rgba(255, 255, 255, 0.12)',

                  <a
                    href={selectedDoc.url}
                    target="_blank"
                    rel="noreferrer"
                    style={{
                      display: 'inline-block',
                      background: '#10B981',
                      color: '#04100C',
                      padding: '8px 16px',
                      borderRadius: '6px',
                      textDecoration: 'none',
                      fontSize: '12px',
                      fontWeight: 700,
                    }}
                  >
                    Open Document in New Tab
                  </a>
                </div>
              )}
            </div>
            <button
              onClick={() => setSelectedDoc(null)}
              style={{
                width: '100%',
                background: 'rgba(255, 255, 255, 0.08)',
                color: '#F4F5F7',
                border: 'none',
                padding: '10px',
                borderRadius: '6px',
                fontSize: '13px',
                fontWeight: 600,
                cursor: 'pointer',
              }}
            >
              Close Preview
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    // =========================================================
    // 4. MAIN APP ROUTER
    // =========================================================

function App() {
  // Authentication State: null | { role: 'student' | 'driver' | 'admin', id, fullName, ... }
  const [currentUser, setCurrentUser] = useState(null);
  const [studentView, setStudentView] = useState('landing'); // 'landing' | 'dashboard'
  const [welcomeToast, setWelcomeToast] = useState(null);

  // Restore Supabase session on initial mount
  useEffect(() => {
    if (!supabase) return;
    let isMounted = true;
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (!isMounted || !session?.user) return;
      supabase.from('profiles').select('*').eq('id', session.user.id).single().then(({ data: profile }) => {
        if (!isMounted || !profile) return;
        setCurrentUser({
          id: session.user.id,
          email: session.user.email,
          role: profile.role || 'student',
          fullName: profile.full_name || 'Campus Rider',
          phone: profile.phone || '',
          studentId: profile.student_id || '',
          driverId: profile.driver_id || '',
          cartNumber: profile.driver_id || 'CART-04',
          residencyStatus: profile.residency_status || 'Hostler',
          hostelBlock: profile.hostel_block || 'Hostel Resident',
          driverApproved: profile.driver_approved,
        });
      }).catch(() => {});
    }).catch(() => {});
    return () => {
      isMounted = false;
    };
  }, []);

  // Auto-dismiss welcome toast after 4 seconds
  useEffect(() => {
    if (welcomeToast) {
      const timer = setTimeout(() => {
        setWelcomeToast(null);
      }, 4000);
      return () => clearTimeout(timer);
    }
  }, [welcomeToast]);

  // Handle successful login/signup from AuthPage
  const handleAuthenticate = ({ role, user }) => {
    setCurrentUser({
      role,
      ...user,
    });
    setStudentView('landing');

    // Craft contextual welcome message
    let message = '';
    if (role === 'admin') {
      message = `Welcome to Transport Office Admin Console, ${user.fullName || 'Admin'}!`;
    } else if (role === 'student') {
      const name = user.fullName || 'Student';
      if (user.mode === 'signup') {
        message = `Welcome to Qartix, ${name}! Your student account is ready.`;
      } else {
        message = `Welcome back, ${name}! Ready for your campus ride?`;
      }
    } else if (role === 'driver') {
      const driverIdent = user.fullName || user.cartNumber || user.id || 'Operator';
      message = `Welcome, Driver ${driverIdent}! Have a safe shift.`;
    }
    setWelcomeToast(message);
  };

  // Handle Logout from any interface
  const handleLogout = async () => {
    if (supabase) {
      await supabase.auth.signOut().catch(() => {});
    }
    setCurrentUser(null);
    setStudentView('landing');
    setWelcomeToast(null);
  };

  // 1. Initial Screen: AuthPage
  if (!currentUser) {
    return <AuthPage onAuthenticate={handleAuthenticate} />;
  }

  return (
    <>
      <style>{`
        @keyframes qartixSlideDown {
          0% {
            transform: translate(-50%, -24px);
            opacity: 0;
          }
          100% {
            transform: translate(-50%, 0);
            opacity: 1;
          }
        }
      `}</style>

      {/* Sleek Auto-Dismissing Welcome Toast / Banner */}
      {Boolean(welcomeToast) && typeof welcomeToast === 'string' && welcomeToast.trim().length > 0 ? (
        <div
          id="qartix-welcome-toast"
          style={{
            position: 'fixed',
            top: '84px',
            left: '50%',
            transform: 'translateX(-50%)',
            zIndex: 9999,
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between',
            gap: '16px',
            backgroundColor: '#1C2128',
            color: '#F4F5F7',
            padding: '12px 18px',
            borderRadius: '10px',
            border: '1px solid rgba(255, 255, 255, 0.15)',
            borderLeft: '4px solid #10B981',
            boxShadow: '0 12px 28px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(16, 185, 129, 0.15)',
            animation: 'qartixSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            maxWidth: '92vw',
            fontFamily: 'Inter, system-ui, -apple-system, sans-serif',
          }}
        >
          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
            <span
              style={{
                width: '8px',
                height: '8px',
                borderRadius: '50%',
                backgroundColor: '#10B981',
                boxShadow: '0 0 10px #10B981',
                flexShrink: 0,
              }}
            />
            <span style={{ fontSize: '13px', fontWeight: 600, letterSpacing: '0.01em', color: '#F4F5F7' }}>
              {welcomeToast}
            </span>
          </div>

          <button
            type="button"
            onClick={() => setWelcomeToast(null)}
            style={{
              width: '24px',
              height: '24px',
              minWidth: '24px',
              minHeight: '24px',
              borderRadius: '50%',
              backgroundColor: 'rgba(255, 255, 255, 0.08)',
              border: '1px solid rgba(255, 255, 255, 0.12)',
              color: '#9CA3AF',
              cursor: 'pointer',
              fontSize: '15px',
              fontWeight: 700,
              lineHeight: 1,
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              padding: 0,
              transition: 'all 0.15s ease',
              flexShrink: 0,
            }}
            onMouseEnter={(e) => {
              e.currentTarget.style.backgroundColor = 'rgba(255, 255, 255, 0.16)';
              e.currentTarget.style.color = '#FFFFFF';
            }}
            onMouseLeave={(e) => {
              e.currentTarget.style.backgroundColor = 'rgba(255, 255, 255, 0.08)';
              e.currentTarget.style.color = '#9CA3AF';
            }}
            aria-label="Close notification"
            title="Close"
          >
            ×
          </button>
        </div>
      ) : null}

      {/* 2. Admin Interface (Transport Office) */}
      {currentUser.role === 'admin' && (
        <AdminInterface
          admin={currentUser}
          onLogout={handleLogout}
        />
      )}

      {/* 3. Driver Interface */}
      {currentUser.role === 'driver' && (
        <DriverInterface
          driver={currentUser}
          onLogout={handleLogout}
        />
      )}

      {/* 4. Student Interface: Pass Builder & Today's Schedule Dashboard */}
      {currentUser.role === 'student' && studentView === 'dashboard' && (
        <StudentDashboard
          student={currentUser}
          onReturnTo3D={() => setStudentView('landing')}
          onLogout={handleLogout}
        />
      )}

      {/* 5. Default Student Interface: 3D WebGL Scroll Experience */}
      {currentUser.role === 'student' && studentView === 'landing' && (
        <StudentLanding
          studentId={currentUser.id}
          onBookPass={() => setStudentView('dashboard')}
          onLogout={handleLogout}
        />
      )}
    </>
  );
}

    // Render to DOM
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>

</html>
